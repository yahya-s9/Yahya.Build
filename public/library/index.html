<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walk the Libraries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Amiri+Quran&family=Noto+Nastaliq+Urdu&display=swap">
<style>
    /* Layout: full-bleed WebGL hall with a few quiet controls over it. */
    :root {
      color-scheme: dark;
      --gold: #d6b36a;
      --cream: #f3e8cf;
      --ink-night: #10161c;
      --parchment: #f1e7d3;
      --ink: #2a1d12;
      --accent: #7c5a22;
      --glass: rgba(15, 20, 25, 0.58);
      --display: Georgia, "Times New Roman", serif;
      --body: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink-night);
      font-family: var(--body);
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 42%, transparent 42%, rgba(3, 7, 11, 0.36) 100%);
      z-index: 2;
    }

    #controls {
      position: fixed;
      right: max(clamp(16px, 3vw, 38px), env(safe-area-inset-right, 0px));
      bottom: calc(clamp(16px, 3vw, 32px) + env(safe-area-inset-bottom, 0px));
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #hint {
      padding: 11px 15px;
      border: 1px solid rgba(214, 179, 106, 0.18);
      border-radius: 999px;
      background: var(--glass);
      color: rgba(243, 232, 207, 0.75);
      font-size: 11px;
      letter-spacing: 0.045em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
    }

    button {
      color: var(--cream);
      font: inherit;
      cursor: pointer;
    }

    .pill {
      min-height: 39px;
      padding: 0 16px;
      border: 1px solid rgba(214, 179, 106, 0.38);
      border-radius: 999px;
      background: rgba(20, 25, 29, 0.72);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .pill:hover {
      border-color: rgba(214, 179, 106, 0.8);
      background: rgba(66, 52, 31, 0.82);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 2px;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: var(--ink-night);
      color: var(--cream);
      font-family: var(--display);
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    #fade {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: #05070a;
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }

    #fade.on {
      opacity: 1;
    }

    #door-hint {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      z-index: 5;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      padding: 9px 15px;
      border: 1px solid rgba(214, 179, 106, 0.4);
      border-radius: 999px;
      background: var(--glass);
      color: var(--cream);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #dot {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 3;
      width: 5px;
      height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
      background: rgba(243, 232, 207, 0.55);
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    body.reading #controls,
    body.reading #credit,
    body.reading #pad {
      visibility: hidden;
    }

    #reader {
      position: fixed;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      overflow-y: auto;
      padding-block: clamp(14px, 4vh, 40px);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      background: rgba(7, 6, 5, 0.84);
      animation: reader-in 260ms ease;
    }

    @keyframes reader-in {
      from { opacity: 0; }
    }

    .qr-shell {
      display: grid;
      justify-items: center;
      gap: 12px;
      width: min(100%, calc((100dvh - 150px) * 2048 / 1400));
    }

    .qr-book {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      perspective: 2400px;
      cursor: pointer;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
    }

    .qr-page {
      position: static;
      display: block;
      width: 100%;
      height: auto;
      cursor: inherit;
    }

    .qr-turn {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .qr-turn.from-right {
      left: 50%;
      transform-origin: left center;
    }

    .qr-turn.from-left {
      left: 0;
      transform-origin: right center;
    }

    .qr-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
    }

    .qr-back {
      transform: rotateY(180deg);
    }

    .qr-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #f2e6c9;
    }

    .qr-surah {
      max-width: 200px;
      padding: 6px 10px;
      border: 1px solid var(--gold);
      border-radius: 4px;
      background: #1a140e;
      color: #f2e6c9;
      font: 18px "Amiri", serif;
    }

    .qr-status {
      min-width: 76px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .qr-note {
      margin: 0;
      color: #bfae8c;
      font-size: 12px;
      text-align: center;
    }

    .leaf {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
      width: 100%;
      max-width: 1000px;
      max-height: min(86dvh, 700px);
      min-height: min(70dvh, 520px);
      overflow: hidden;
      border: 1px solid var(--gold);
      border-radius: 4px;
      background: var(--parchment);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
      color: var(--ink);
    }

    .about {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      padding: clamp(20px, 3.4vw, 40px);
      overflow-y: auto;
      border-right: 1px solid rgba(138, 104, 48, 0.4);
      text-align: center;
    }

    .about .script {
      margin: 6px 0 10px;
      color: var(--accent);
      font-family: "Noto Nastaliq Urdu", "Amiri", serif;
      font-size: clamp(25px, 3.4vw, 36px);
      line-height: 2;
    }

    .about h2 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(22px, 2.6vw, 30px);
      font-weight: 400;
      line-height: 1.15;
      text-wrap: balance;
    }

    .about .by {
      margin: 0;
      font-size: 13px;
      opacity: 0.8;
    }

    .about .subject {
      margin: 8px 0 0;
      font-family: var(--display);
      font-size: 15px;
      line-height: 1.55;
    }

    .about a {
      margin-top: auto;
      padding-top: 12px;
      color: var(--accent);
      font-size: 12px;
    }

    .list {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: clamp(16px, 2.6vw, 30px);
    }

    .list h3 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .list p {
      margin: 0;
      font-family: var(--display);
      font-size: 15px;
      line-height: 1.5;
    }

    .list ol {
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
    }

    .list button,
    .list .plain {
      display: grid;
      grid-template-columns: 2.6em minmax(0, 1fr);
      gap: 4px;
      width: 100%;
      padding: 7px 6px;
      border: 0;
      border-bottom: 1px solid rgba(138, 104, 48, 0.2);
      background: none;
      color: var(--ink);
      font-family: var(--display);
      font-size: 14px;
      line-height: 1.35;
      text-align: left;
    }

    .list .plain {
      opacity: 0.45;
    }

    .list button:hover {
      background: rgba(138, 104, 48, 0.14);
    }

    .list span:first-child {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    #reader button:focus-visible,
    #reader a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .close {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: max(16px, env(safe-area-inset-right, 0px));
      z-index: 13;
    }

    .sheet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .sheet img {
      flex: 1;
      min-height: 0;
      max-width: 100%;
      max-height: calc(100dvh - 118px);
      object-fit: contain;
      border-radius: 2px;
      background: var(--parchment);
    }

    .waiting {
      color: var(--cream);
      font-family: var(--display);
      font-size: 18px;
    }

    .turn {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--cream);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .fades {
      transition: opacity 600ms ease, visibility 600ms ease;
    }

    .fades.gone {
      opacity: 0;
      visibility: hidden;
    }

    #credit {
      position: fixed;
      bottom: calc(clamp(16px, 3vw, 32px) + env(safe-area-inset-bottom, 0px));
      left: max(clamp(16px, 3vw, 38px), env(safe-area-inset-left, 0px));
      z-index: 4;
      max-width: min(300px, calc(100vw - 32px));
      color: rgba(243, 232, 207, 0.86);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      font-size: 10px;
      line-height: 1.5;
      pointer-events: none;
    }

    #pad {
      position: fixed;
      left: max(16px, env(safe-area-inset-left, 0px));
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 5;
      display: none;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 6px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #pad button {
      min-height: 0;
      padding: 0;
      font-size: 14px;
    }

    #pad [data-action="forward"] {
      grid-column: 2;
    }

    #pad [data-action="left"] {
      grid-column: 1;
      grid-row: 2;
    }

    @media (pointer: coarse) {
      #pad {
        display: grid;
      }

      #credit {
        bottom: calc(150px + env(safe-area-inset-bottom, 0px));
      }

      #hint {
        display: none;
      }
    }

    @media (max-width: 680px) {
      #hint {
        display: none;
      }

      #controls {
        flex-direction: column;
        align-items: flex-end;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pill,
      .fades {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <div id="loading">Opening the hall…</div>

  <div id="vignette"></div>
  <div id="fade"></div>
  <div id="door-hint" hidden></div>

  <!--
    The Grand Reading Room comes from the CCORE Three.js 3D Scenes dataset (MIT), scene-001446.
    The Library of Cordoba and the House of Wisdom were generated by Qwen3.5-4B-3D-Coder, then rebuilt for walking.
  -->
  <small id="credit" class="fades">
    Grand Reading Room from the CCORE Three.js 3D Scenes dataset (MIT), scene-001446.
    Library of Cordoba and House of Wisdom generated by Qwen3.5-4B-3D-Coder.
  </small>

  <div id="dot" hidden></div>
  <div id="reader" hidden></div>

  <div id="pad" aria-label="Walking controls">
    <button class="pill" type="button" data-action="forward" aria-label="Walk forward">W</button>
    <button class="pill" type="button" data-action="left" aria-label="Step left">A</button>
    <button class="pill" type="button" data-action="back" aria-label="Walk back">S</button>
    <button class="pill" type="button" data-action="right" aria-label="Step right">D</button>
  </div>

  <div id="controls">
    <div id="hint" class="fades">W A S D to walk · Click to look · Aim at a book and click to open it</div>
  </div>


  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const camera = new THREE.PerspectiveCamera(
      46,
      window.innerWidth / window.innerHeight,
      0.1,
      160
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;  // lighting never moves; redrawn per map
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.localClippingEnabled = false;
    document.body.prepend(renderer.domElement);

    // ---------------------------------------------------------------------
    // Maghrib, shared by both halls: the sky after sunset, and candlelight
    // ---------------------------------------------------------------------

    function addDuskSky(scene) {
      const canvas = document.createElement("canvas");
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      const atElevation = degrees => H * (0.5 - degrees / 180);

      const sky = ctx.createLinearGradient(0, atElevation(90), 0, atElevation(0));
      sky.addColorStop(0, "#080b20");
      sky.addColorStop(0.35, "#141638");
      sky.addColorStop(0.55, "#3a2760");
      sky.addColorStop(0.7, "#8a3f66");
      sky.addColorStop(0.85, "#d9653f");
      sky.addColorStop(1, "#f0a050");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H / 2);
      ctx.fillStyle = "#14101c";
      ctx.fillRect(0, H / 2, W, H / 2);

      // Afterglow on the western horizon. This texture coordinate faces -z.
      const west = W * 0.75;
      ctx.save();
      ctx.translate(west, H / 2);
      ctx.scale(2.6, 1);
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, H * 0.3);
      glow.addColorStop(0, "rgba(255, 164, 84, 0.95)");
      glow.addColorStop(0.45, "rgba(226, 90, 70, 0.5)");
      glow.addColorStop(1, "rgba(120, 50, 100, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(-W, -H / 2, W * 2, H / 2);
      ctx.restore();

      // Stars come out away from the glow.
      let seed = 4711;
      const next = () => (seed = seed * 1664525 + 1013904223 >>> 0) / 4294967296;
      for (let i = 0; i < 900; i++) {
        const x = next() * W;
        const elevation = 16 + next() * 74;
        const away = Math.min(Math.abs(x - west), W - Math.abs(x - west)) / (W / 2);
        const alpha = Math.min(1, (elevation - 16) / 34) * (0.35 + away * 0.65) * (0.4 + next() * 0.6);
        ctx.fillStyle = `rgba(255, 244, 222, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, atElevation(elevation), 0.7 + next() * 1.1, 0, Math.PI * 2);
        ctx.fill();
      }

      // The thin new moon, horns turned away from where the sun went down.
      const moonX = W * 0.715;
      const moonY = atElevation(32);
      const moonR = 26;
      ctx.fillStyle = "#fff3d0";
      ctx.shadowColor = "rgba(255, 236, 190, 0.9)";
      ctx.shadowBlur = 22;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, Math.PI * 0.6, Math.PI * 1.9 + 0.5, true);
      ctx.arc(moonX + 7, moonY - 9, moonR * 0.8, Math.PI * 1.9 + 0.5, Math.PI * 0.6, false);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(120, 48, 24),
        new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.BackSide,
          fog: false,
          toneMapped: false,
          depthWrite: false
        })
      );
      scene.add(dome);
      scene.background = new THREE.Color(0x080b20);
    }

    // Wax candles in one draw call, with flames that move each on its own.
    function addCandles(scene, spots) {
      const wax = new THREE.InstancedMesh(
        new THREE.CylinderGeometry(0.038, 0.042, 0.26, 10),
        new THREE.MeshStandardMaterial({
          color: 0xf3e6c8,
          emissive: 0x8a4a16,
          emissiveIntensity: 0.5,
          roughness: 0.6
        }),
        spots.length
      );

      const flames = new THREE.InstancedMesh(
        new THREE.SphereGeometry(1, 10, 8),
        new THREE.MeshBasicMaterial({ color: 0xffcf7a, toneMapped: false }),
        spots.length
      );
      flames.frustumCulled = false;
      wax.frustumCulled = false;

      const place = new THREE.Matrix4();
      const halo = new Float32Array(spots.length * 3);

      spots.forEach(([x, y, z], index) => {
        wax.setMatrixAt(index, place.makeTranslation(x, y + 0.13, z));
        halo.set([x, y + 0.36, z], index * 3);
      });

      scene.add(wax, flames);

      const glowCanvas = document.createElement("canvas");
      glowCanvas.width = glowCanvas.height = 64;
      const ctx = glowCanvas.getContext("2d");
      const fade = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      fade.addColorStop(0, "rgba(255, 196, 110, 0.9)");
      fade.addColorStop(0.3, "rgba(255, 150, 60, 0.28)");
      fade.addColorStop(1, "rgba(255, 120, 40, 0)");
      ctx.fillStyle = fade;
      ctx.fillRect(0, 0, 64, 64);

      const haloGeometry = new THREE.BufferGeometry();
      haloGeometry.setAttribute("position", new THREE.BufferAttribute(halo, 3));
      scene.add(new THREE.Points(haloGeometry, new THREE.PointsMaterial({
        map: new THREE.CanvasTexture(glowCanvas),
        size: 0.85,
        transparent: true,
        opacity: 0.8,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fog: false
      })));

      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const position = new THREE.Vector3();
      const rotation = new THREE.Quaternion();
      const size = new THREE.Vector3();

      return elapsed => {
        spots.forEach(([x, y, z], index) => {
          const flicker = still
            ? 1
            : 1 + Math.sin(elapsed * 9 + index * 2.3) * 0.13 + Math.sin(elapsed * 17 + index) * 0.08;
          position.set(x, y + 0.34, z);
          size.set(0.04, 0.095 * flicker, 0.04);
          flames.setMatrixAt(index, place.compose(position, rotation, size));
        });
        flames.instanceMatrix.needsUpdate = true;
      };
    }

    // ---------------------------------------------------------------------
    // The horseshoe door shared by both halls; its face looks towards -z
    // ---------------------------------------------------------------------

    // `wall` stands the door on the room's edge at that angle, `z` from the middle.
    function addHorseshoeDoor(scene, z, size, flip = false, wall = null) {
      const RADIUS = 1.25;
      const OVERSHOOT = Math.PI / 6;
      const IMPOST = 2.9;
      const CENTER = IMPOST + RADIUS * Math.sin(OVERSHOOT);
      const CHORD = RADIUS * Math.cos(OVERSHOOT);
      const RING = 0.38;
      const STONES = 15;

      const material = (color, roughness, metalness = 0) =>
        new THREE.MeshStandardMaterial({ color, roughness, metalness });

      const timber = material(0x4a2a1a, 0.7);
      const plaster = material(0xe6d8bb, 0.82);
      const red = material(0x87303b, 0.76);
      const white = material(0xf0e6d3, 0.6);
      const brass = material(0xc29a4a, 0.3, 0.85);

      const door = new THREE.Group();
      door.position.set(0, 0, z);
      door.scale.setScalar(size);
      if (flip) door.rotation.y = Math.PI;
      if (wall !== null) {
        door.position.set(Math.sin(wall) * z, 0, Math.cos(wall) * z);
        door.rotation.y = wall;
      }
      scene.add(door);

      const part = (geometry, mat, x = 0, y = 0, depth = 0) => {
        const mesh = new THREE.Mesh(geometry, mat);
        mesh.position.set(x, y, depth);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        door.add(mesh);
        return mesh;
      };

      // Plaster panel and gold frame.
      part(new THREE.BoxGeometry(3.9, 5.4, 0.14), plaster, 0, 2.7, 0.05);
      part(new THREE.BoxGeometry(3.9, 0.08, 0.18), brass, 0, 5.36, 0.02);
      part(new THREE.BoxGeometry(0.08, 5.4, 0.18), brass, -1.91, 2.7, 0.02);
      part(new THREE.BoxGeometry(0.08, 5.4, 0.18), brass, 1.91, 2.7, 0.02);

      // Timber leaves filling the arch.
      const leaf = new THREE.Shape();
      leaf.moveTo(-CHORD, 0);
      leaf.lineTo(CHORD, 0);
      leaf.lineTo(CHORD, IMPOST);
      leaf.absarc(0, CENTER, RADIUS, -OVERSHOOT, Math.PI + OVERSHOOT, false);
      leaf.closePath();

      const leafGeometry = new THREE.ExtrudeGeometry(leaf, {
        depth: 0.1,
        bevelEnabled: false,
        curveSegments: 32
      });
      part(leafGeometry, timber, 0, 0, -0.06);
      part(new THREE.BoxGeometry(0.05, CENTER + RADIUS - 0.04, 0.03), brass, 0, (CENTER + RADIUS) / 2, -0.075);

      // Rows of brass studs, stopping short of the curve.
      const stud = new THREE.SphereGeometry(0.035, 10, 8);
      for (let row = 0; row < 7; row++) {
        const y = 0.45 + row * 0.62;
        const reach = y > IMPOST
          ? Math.sqrt(Math.max(0, RADIUS * RADIUS - (y - CENTER) * (y - CENTER)))
          : CHORD;

        for (let x = 0.25; x < reach - 0.12; x += 0.3) {
          part(stud, brass, x, y, -0.07);
          part(stud, brass, -x, y, -0.07);
        }
      }

      // Rings on both leaves.
      for (const x of [-0.24, 0.24]) {
        const ring = part(new THREE.TorusGeometry(0.1, 0.018, 8, 24), brass, x, 1.75, -0.1);
        ring.rotation.y = 0;
      }

      // Striped voussoirs and matching jambs.
      const sweep = (Math.PI + OVERSHOOT * 2) / STONES;
      const wedge = new THREE.Shape();
      wedge.absarc(0, 0, RADIUS, -sweep / 2 + 0.008, sweep / 2 - 0.008, false);
      wedge.absarc(0, 0, RADIUS + RING, sweep / 2 - 0.008, -sweep / 2 + 0.008, true);
      wedge.closePath();

      const wedgeGeometry = new THREE.ExtrudeGeometry(wedge, {
        depth: 0.18,
        bevelEnabled: false,
        curveSegments: 4
      });

      for (let i = 0; i < STONES; i++) {
        const stone = part(wedgeGeometry, i % 2 ? white : red, 0, CENTER, -0.17);
        stone.rotation.z = -OVERSHOOT + sweep * (i + 0.5);
      }

      const jamb = new THREE.BoxGeometry(0.34, 0.62, 0.18);
      for (let i = 0; i < 5; i++) {
        const y = 0.31 + i * 0.64;
        part(jamb, i % 2 ? white : red, -CHORD - 0.17, y, -0.08);
        part(jamb, i % 2 ? white : red, CHORD + 0.17, y, -0.08);
      }

      // A warm lamp over the door so it reads as the way through.
      const glow = new THREE.PointLight(0xffc675, 16, 8, 2);
      glow.position.set(0, 3.6, -1.1);
      door.add(glow);
    }

    // ---------------------------------------------------------------------
    // Books from the Bookshelf repo, each resting on a folding rahle stand.
    // BOOKS is a snapshot made by fetch_books.py.
    // ---------------------------------------------------------------------

    const BOOKS = [];
    const hallOf = book => /machine|mathematic/i.test(book.shelf) ? "reading-room" : "cordoba";
    try {
      const response = await fetch("/library/books");
      if (response.ok) BOOKS.push(...(await response.json()));
    } catch {
      // The halls still open; they just have no books on the stands.
    }
    const readable = entry => Boolean(entry.href || entry.pages?.length);
    const hasNotes = book => book.contents.some(readable);

    // Page images in the artifact; on the website, PDFs read live from GitHub.
    let pdfjs = null;

    async function openPdf(href) {
      pdfjs ??= import("/pdfjs/pdf.min.mjs").then(module => {
        module.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.mjs";
        return module;
      });

      const raw = href.replace(
        /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\//,
        "https://raw.githubusercontent.com/$1/$2/"
      );
      const [lib, response] = await Promise.all([pdfjs, fetch(raw)]);
      if (!response.ok) throw new Error(`PDF ${response.status}`);

      const pdf = await lib.getDocument({ data: new Uint8Array(await response.arrayBuffer()) }).promise;
      const rendered = new Map();

      return {
        count: pdf.numPages,
        src(index) {
          if (!rendered.has(index)) {
            rendered.set(index, (async () => {
              const page = await pdf.getPage(index + 1);
              const viewport = page.getViewport({ scale: 1.7 });
              const paper = document.createElement("canvas");
              paper.width = Math.floor(viewport.width);
              paper.height = Math.floor(viewport.height);
              await page.render({ canvasContext: paper.getContext("2d"), viewport }).promise;
              return paper.toDataURL("image/jpeg", 0.86);
            })());
          }
          return rendered.get(index);
        }
      };
    }

    async function pagesOf(entry) {
      if (entry.pages?.length) {
        return { count: entry.pages.length, src: index => entry.pages[index] };
      }
      entry.doc ??= openPdf(entry.href).catch(error => {
        entry.doc = null;
        throw error;
      });
      return entry.doc;
    }

    function drawCover(canvas, book) {
      const [base, gold, light] = book.colors;
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      ctx.fillStyle = base;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = gold;
      ctx.lineWidth = 7;
      ctx.strokeRect(22, 22, W - 44, H - 44);
      ctx.lineWidth = 2;
      ctx.strokeRect(36, 36, W - 72, H - 72);

      // A mihrab arch framing the title.
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(84, H - 84);
      ctx.lineTo(84, H * 0.36);
      ctx.quadraticCurveTo(84, H * 0.2, W / 2, 84);
      ctx.quadraticCurveTo(W - 84, H * 0.2, W - 84, H * 0.36);
      ctx.lineTo(W - 84, H - 84);
      ctx.closePath();
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = light;
      if (book.ar) {
        let size = 58;
        ctx.font = `${size}px "Noto Nastaliq Urdu", "Amiri", serif`;
        while (ctx.measureText(book.ar).width > W - 200 && size > 24) {
          size -= 2;
          ctx.font = `${size}px "Noto Nastaliq Urdu", "Amiri", serif`;
        }
        ctx.fillText(book.ar, W / 2, H * 0.44);
      }

      ctx.fillStyle = gold;
      const words = book.title.split(" ");
      const lines = [""];
      ctx.font = '26px Georgia, "Times New Roman", serif';
      for (const word of words) {
        const line = `${lines[lines.length - 1]} ${word}`.trim();
        if (ctx.measureText(line).width > W - 210) lines.push(word);
        else lines[lines.length - 1] = line;
      }
      lines.forEach((line, i) => ctx.fillText(line, W / 2, H * 0.66 + i * 34));
    }

    let glowTexture = null;

    function bookGlow() {
      if (!glowTexture) {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 128;
        const ctx = canvas.getContext("2d");
        const fade = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        fade.addColorStop(0, "rgba(255, 214, 140, 1)");
        fade.addColorStop(0.45, "rgba(255, 190, 100, 0.35)");
        fade.addColorStop(1, "rgba(255, 170, 80, 0)");
        ctx.fillStyle = fade;
        ctx.fillRect(0, 0, 128, 128);
        glowTexture = new THREE.CanvasTexture(canvas);
      }

      return new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTexture,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 0.08
      }));
    }

    function placeBooks(scene, hall, spots, size) {
      const wood = new THREE.MeshStandardMaterial({ color: 0x5a3320, roughness: 0.62 });
      const pages = new THREE.MeshStandardMaterial({ color: 0xe6d8b8, roughness: 0.9 });

      return BOOKS.filter(book => hallOf(book) === hall).slice(0, spots.length).map((data, index) => {
        const [x, z, yaw] = spots[index];
        const stand = new THREE.Group();
        stand.position.set(x, 0, z);
        stand.rotation.y = yaw;
        stand.scale.setScalar(size);
        scene.add(stand);

        // Crossed boards seen from the side, as on a folding rahle.
        for (const side of [-0.3, 0.3]) {
          for (const lean of [-0.42, 0.42]) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.1, 0.09), wood);
            leg.position.set(side, 0.52, 0);
            leg.rotation.x = lean;
            leg.castShadow = true;
            stand.add(leg);
          }
        }

        const tray = new THREE.Group();
        tray.position.set(0, 1.03, 0);
        tray.rotation.x = 0.62;
        stand.add(tray);

        const board = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.035, 0.96), wood);
        board.castShadow = true;
        tray.add(board);

        const ledge = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.08, 0.04), wood);
        ledge.position.set(0, 0.05, 0.47);
        tray.add(ledge);

        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 720;
        drawCover(canvas, data);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 8;

        const redraw = () => {
          drawCover(canvas, data);
          texture.needsUpdate = true;
        };
        document.fonts?.load?.('58px "Noto Nastaliq Urdu"', data.ar || "ا").then(redraw, () => {});

        const cover = new THREE.MeshStandardMaterial({
          map: texture,
          emissive: 0xffffff,
          emissiveMap: texture,
          emissiveIntensity: 0.05,
          roughness: 0.5
        });
        const edge = new THREE.MeshStandardMaterial({ color: data.colors[0], roughness: 0.6 });

        // Box faces: +x -x +y -y +z -z. The cover is the top face.
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.6, 0.11, 0.84),
          [pages, edge, cover, edge, pages, pages]
        );
        mesh.position.y = 0.075;
        mesh.castShadow = true;
        tray.add(mesh);

        const book = { data, mesh, tray, cover, glow: null, hovered: false, notes: hasNotes(data) };

        if (book.notes) {
          book.glow = bookGlow();
          book.glow.position.y = 0.16;
          book.glow.scale.set(1.5, 1.5, 1);
          tray.add(book.glow);
        }

        return book;
      });
    }

    // Books with notes breathe, very faintly; the one you aim at wakes up.
    function pulseBooks(books, elapsed) {
      for (const book of books) {
        const wave = book.notes ? Math.sin(elapsed * 1.1 + book.mesh.id) : 0;
        const rest = book.notes ? 0.1 + wave * 0.025 : 0.05;
        book.cover.emissiveIntensity = book.hovered ? 0.4 : rest;
        if (book.glow) book.glow.material.opacity = (book.hovered ? 0.2 : 0.075) + wave * 0.02;
      }
    }

    // Map: The Grand Reading Room

    function buildReadingRoom() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x10161c);
      scene.fog = new THREE.FogExp2(0x111820, 0.011);

    const TAU = Math.PI * 2;
    const Y_AXIS = new THREE.Vector3(0, 1, 0);

    // A moving vertical clipping plane creates a cutaway architectural view.
    const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);

    function cuttable(material) {
      material.clippingPlanes = [cutPlane];
      material.clipShadows = true;
      return material;
    }

    let seed = 90210;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    const rand = (min, max) => min + (max - min) * random();

    // ---------------------------------------------------------------------
    // Procedural textures
    // ---------------------------------------------------------------------

    function makeMarbleTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 512;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#aa9679";
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 170; i++) {
        const y = rand(-40, 552);
        const bend = rand(-100, 100);
        ctx.beginPath();
        ctx.moveTo(-20, y);
        ctx.bezierCurveTo(
          130, y + bend,
          330, y - bend * 0.7,
          532, y + rand(-60, 60)
        );
        ctx.strokeStyle = i % 4 === 0
          ? "rgba(74,61,48,0.10)"
          : "rgba(238,224,192,0.10)";
        ctx.lineWidth = rand(0.4, 2.3);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(3, 3);
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }

    function makeSkyTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createLinearGradient(0, 0, 0, 256);
      gradient.addColorStop(0, "#10122e");
      gradient.addColorStop(0.58, "#5b2f5e");
      gradient.addColorStop(1, "#e0763a");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 256);

      ctx.fillStyle = "rgba(255,244,222,0.85)";
      for (let i = 0; i < 70; i++) {
        ctx.beginPath();
        ctx.ellipse(
          rand(-20, 148),
          rand(4, 150),
          rand(0.5, 1.1),
          rand(0.5, 1.1),
          rand(-0.2, 0.2),
          0,
          TAU
        );
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const bookPalette = [
      0x6e2523, 0x264b45, 0x304d72, 0x8b4f26,

    const unitBox = new THREE.BoxGeometry(1, 1, 1);
    const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 32);
    const unitSphere = new THREE.SphereGeometry(1, 20, 12);
    const unitPlane = new THREE.PlaneGeometry(1, 1);

    function box(parent, material, x, y, z, sx, sy, sz, ry = 0) {
      const mesh = new THREE.Mesh(unitBox, material);
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      mesh.rotation.y = ry;
      mesh.castShadow = !material.transparent;

    function cylinder(parent, material, radius, height, x, y, z) {

    function torus(parent, material, radius, tube, x, y, z, rx = 0, ry = 0) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(radius, tube, 10, 96),

      );
      mesh.position.set(x, y, z);

    // ---------------------------------------------------------------------
    // Floor and circular shell

    cylinder(scene, materials.base, 19.15, 0.9, 0, -0.82, 0);

    const floorGeometry = new THREE.CylinderGeometry(18.6, 18.9, 0.7, 96);
    const floor = new THREE.Mesh(floorGeometry, [
      materials.floorSide,

    floor.receiveShadow = true;
    scene.add(floor);

    const inlayMaterial = new THREE.MeshStandardMaterial({
      color: 0x8f7039,

      metalness: 0.48
    });

    [3.1, 5.9, 12.0, 16.2].forEach(radius => {
      torus(scene, inlayMaterial, radius, 0.035, 0, 0.027, 0, Math.PI / 2);
    });

    for (let i = 0; i < 16; i++) {
      const angle = i * TAU / 16;
      const x = Math.sin(angle) * 10.0;
      const z = Math.cos(angle) * 10.0;
      box(scene, inlayMaterial, x, 0.028, z, 0.027, 0.015, 13.5, angle);

    const wall = new THREE.Mesh(
      new THREE.CylinderGeometry(18.5, 18.5, 14, 96, 1, true),
      materials.wall
    );
    wall.position.y = 7;
    wall.receiveShadow = true;
    scene.add(wall);

    torus(scene, materials.stone, 18.25, 0.3, 0, 0.35, 0, Math.PI / 2);
    torus(scene, materials.stone, 18.25, 0.22, 0, 10.85, 0, Math.PI / 2);
    torus(scene, materials.stone, 18.35, 0.34, 0, 14.0, 0, Math.PI / 2);

    // ---------------------------------------------------------------------
    // Andalusian dome: a drum of pierced horseshoe windows, a plain stone band,
    // then a lapis vault of gold stars crossed by interlaced ribs,
    // after the domes of Cordoba's Great Mosque and the Alhambra's Comares hall
    // ---------------------------------------------------------------------

    const DRUM_BASE = 14;
    const DRUM_TOP = 17.85;
    const VAULT_BASE = 20.3;
    const VAULT_RADIUS = 16.2;
    const VAULT_RISE = 11.9;
    const CROWN_RADIUS = 2.3;
    const CROWN_Y = 31.9;

    const domeGold = new THREE.MeshStandardMaterial({
      color: 0xd9a441,
      emissive: 0x6a4312,
      emissiveIntensity: 0.7,
      metalness: 0.45,
      roughness: 0.4
    });

    function domeTexture(width, height, paint) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      paint(canvas.getContext("2d"));
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function starOutline(radius, points = 8, waist = 0.62) {
      const outline = [];
      for (let i = 0; i < points * 2; i++) {
        const angle = i * Math.PI / points;
        const r = i % 2 ? radius * waist : radius;
        outline.push([Math.cos(angle) * r, Math.sin(angle) * r]);
      }
      return outline;
    }

    function traceOutline(ctx, outline) {
      outline.forEach(([x, y], index) => (index ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
    }

    // The lapis vault, painted in latitude and longitude so the rows of stars
    // keep their shape as they close towards the crown.
    const vaultTexture = domeTexture(4096, 1536, ctx => {
      const W = ctx.canvas.width;
      const H = ctx.canvas.height;

      const ground = ctx.createLinearGradient(0, 0, 0, H);
      ground.addColorStop(0, "#102a5c");
      ground.addColorStop(1, "#1c4385");
      ctx.fillStyle = ground;
      ctx.fillRect(0, 0, W, H);

      const place = (lon, lat, outline) => outline.map(([x, y]) => [
        W * (lon + x / Math.max(Math.cos(lat), 0.14)) / TAU,
        H * (1 - (lat + y) / (Math.PI / 2))
      ]);

      const step = 0.17;
      ctx.lineJoin = "round";

      for (let row = 0; row * step < 1.34; row++) {
        const lat = 0.08 + row * step;
        const count = 4 * Math.round(TAU * Math.cos(lat) / step / 4);

        for (let i = 0; i < count; i++) {
          const lon = (i + (row % 2 ? 0.5 : 0)) * TAU / count;

          for (const wrap of [-TAU, 0, TAU]) {
            ctx.beginPath();
            traceOutline(ctx, place(lon + wrap, lat, starOutline(step * 0.42)));
            ctx.fillStyle = "#e3b04f";
            ctx.fill();

            ctx.beginPath();
            traceOutline(ctx, place(lon + wrap, lat, starOutline(step * 0.2, 8, 0.7)));
            ctx.fillStyle = (i + row) % 3 ? "#16346b" : "#8a2b2a";
            ctx.fill();

            ctx.beginPath();

      path.lineTo(-across, straight);
      path.absarc(0, straight + radius * Math.sin(lean), radius, Math.PI + lean, -lean, true);

      addHorseshoeDoor(scene, 16.5, 1.2);

      }

      const bookSpots = [30, 150, 270, 90, 210, 330].map(degrees => {
        const angle = degrees * Math.PI / 180;
        const x = Math.sin(angle) * 12.6;
        const z = Math.cos(angle) * 12.6;
        return [x, z, Math.atan2(-x, -z)];
