      box(5.1, 11.2, 0.1, materials.darkWood, x, 5.6, 29.4);
    }
    for (const side of [-1, 1]) {
      for (const z of [15.4, 19.2, 23.0]) {
        box(0.1, 11.2, 3.7, materials.darkWood, side * 10.9, 5.6, z);
      }
    }

    // Cloister along both long sides of the court.
    const CLOISTER_X = 12.4;
    const cloisterColumns = [1.8, 4.6, 7.4, 10.2];
    for (const side of [-1, 1]) {
      for (const z of cloisterColumns) addColumn(side * CLOISTER_X, z, 2.9);
      for (const z of [3.2, 6, 8.8]) {
        addPointedArch(side * CLOISTER_X, 3, z, 2.8, 1.7, 2, 1.25, side * Math.PI / 2);
      }
      box(2.6, 0.3, 11.2, materials.darkWood, side * 13.25, 4.8, 6);
    }

    // Chains for the hall's lamps, posts for the two in the court.
    for (const [x, z] of [[-8.2, 15.3], [8.2, 15.3], [-8.2, 24.5], [8.2, 24.5]]) {
      cylinder(0.025, 0.025, 5.2, materials.iron, x, 10.3, z, scene, 6);
    }
    for (const x of [-4.4, 4.4]) cylinder(0.05, 0.08, 3.1, materials.iron, x, 1.55, 2.6, scene, 8);

    const deskSpots = [[-5.5, 17.2], [5.1, 18.1], [-7, 21.6], [7.1, 22.5], [-1.8, 25.3], [2, 25.7]];

    const candleSpots = [];
    for (const [x, z] of deskSpots) {
      candleSpots.push([x - 1.25, 1.19, z + 0.42], [x + 1.25, 1.19, z - 0.42]);
    }
    for (let i = 0; i < 16; i++) {
      const angle = i * Math.PI * 2 / 16;
      candleSpots.push([Math.sin(angle) * 2.1, 0.36, 5.2 + Math.cos(angle) * 2.1]);
    }
    const moveCandles = addCandles(scene, candleSpots);

    const courtGlow = new THREE.PointLight(0xffb066, 60, 20, 2);
    courtGlow.position.set(0, 2.2, 8);
    scene.add(courtGlow);

    // ---- Collision -------------------------------------------------------

    const BODY = 0.4;
    const GATE = 1.85;          // half the walkable width of the great arch
    const COURT_END = 11.1;
    const HALL_START = 12.7;

    const circles = [
      [0, 5.2, 2.3],            // fountain
      [0, 14.8, 1],             // astrolabe
      [6.4, 23.3, 0.85],        // globe
      [-4.4, 2.6, 0.25],
      [4.4, 2.6, 0.25],
      ...palmSpots.map(([x, z]) => [x, z, 0.3]),
      ...[-1, 1].flatMap(side => cloisterColumns.map(z => [side * CLOISTER_X, z, 0.75]))
    ];

    // A desk and the scholar standing at it, who is on the desk's -z side.
    const rects = deskSpots.map(([x, z]) => [x - 1.75, x + 1.75, z - 1.8, z + 0.88]);

    let lastX = 0;
    let lastZ = 0;

    function collideWisdom(p) {
      for (const [cx, cz, radius] of circles) {
        const dx = p.x - cx;
        const dz = p.z - cz;
        const gap = Math.hypot(dx, dz) || 0.0001;
        const reach = radius + BODY;
        if (gap < reach) {
          p.x = cx + dx / gap * reach;
          p.z = cz + dz / gap * reach;
        }
      }

      for (const [left, right, near, far] of rects) {
        if (p.x > left - BODY && p.x < right + BODY && p.z > near - BODY && p.z < far + BODY) {
          const moves = [
            [p.x - left + BODY, -1, 0], [right + BODY - p.x, 1, 0],
            [p.z - near + BODY, 0, -1], [far + BODY - p.z, 0, 1]
          ].sort((a, b) => a[0] - b[0]);
          const [room, mx, mz] = moves[0];
          p.x += mx * room;
          p.z += mz * room;
        }
      }

      // Court, hall, and the passage through the arch between them.
      if (p.z > COURT_END && p.z < HALL_START) {
        if (Math.abs(lastX) <= GATE) {
          p.x = Math.max(-GATE, Math.min(GATE, p.x));
        } else {
          p.z = lastZ < 11.9 ? COURT_END : HALL_START;
        }
      }
      const limitX = p.z < 11.9 ? 13.6 : 9.75;
      p.x = Math.max(-limitX, Math.min(limitX, p.x));
      p.z = Math.max(1.3, Math.min(28.2, p.z));

      lastX = p.x;
      lastZ = p.z;
    }


      return {
        scene,
        exposure: 1.1,
        fov: 58,
        eye: 1.9,           // a scholar stands 2 units tall
        walk: 4.2,
        run: 7.6,
        entrance: { x: -3.5, z: 2.3, yaw: -2.8, pitch: 0.12 },
        doors: [{
          side: -1,
          edge: -1.4,
          halfWidth: 1.1,
          to: "reading-room",
          label: "Door to the Grand Reading Room: walk into it",
          arrive: { x: 0, z: -14.2, yaw: Math.PI, pitch: 0.08 }
        }],
        books: [],
        bookSize: 1,
        collide: collideWisdom,
        update(time) {
          for (const palm of palms) {
            palm.crown.rotation.z = Math.sin(time * 0.72 + palm.phase) * 0.025;
            palm.crown.rotation.x = Math.cos(time * 0.57 + palm.phase) * 0.018;
          }

          for (const scholar of scholars) {
            scholar.head.rotation.y = Math.sin(time * 0.7 + scholar.phase) * 0.07;
            scholar.head.rotation.x = Math.cos(time * 0.48 + scholar.phase) * 0.035;
          }

          for (const entry of animatedFlames) {
            const flicker = 0.82 + Math.sin(time * 6.1 + entry.phase) * 0.12
              + Math.sin(time * 9.3 + entry.phase * 1.7) * 0.06;
            entry.flame.scale.set(0.85 + flicker * 0.15, flicker, 0.85 + flicker * 0.15);
            entry.flame.material.opacity = 0.82 + flicker * 0.14;
          }

          for (const [index, light] of lampLights.entries()) {
            light.intensity = 90 * (0.9 + Math.sin(time * 5.7 + index * 1.9) * 0.08);
          }

          water.rotation.z = Math.sin(time * 0.45) * 0.012;
          fountainWater.scale.setScalar(1 + Math.sin(time * 1.1) * 0.006);

          const position = dustGeometry.attributes.position;
          for (let i = 0; i < dustCount; i++) {
            const index = i * 3;
            position.array[index] = dustBase[index] + Math.sin(time * 0.32 + i * 1.7) * 0.12;
            position.array[index + 1] = dustBase[index + 1] + Math.sin(time * 0.43 + i) * 0.14;
            position.array[index + 2] = dustBase[index + 2] + Math.cos(time * 0.28 + i * 0.8) * 0.1;
          }
          position.needsUpdate = true;

          globeSphere.rotation.y = time * 0.08;
          globeSphere.rotation.x = Math.sin(time * 0.12) * 0.15;
          armillary.rotation.y = time * 0.11;
          armillary.rotation.x = Math.sin(time * 0.16) * 0.18;
          pointer.rotation.z = -0.35 + Math.sin(time * 0.7) * 0.12;
          moveCandles(time);
        }
      };
    }

    // ---------------------------------------------------------------------
    // First-person walking, shared by every map
    // ---------------------------------------------------------------------

    const LOOK_SPEED = 0.0022;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canvas = renderer.domElement;
    canvas.tabIndex = 0;
    camera.rotation.order = "YXZ";

    const builders = {
      "reading-room": buildReadingRoom,
      cordoba: buildCordoba,
      "house-of-wisdom": buildHouseOfWisdom,
      "quran-hall": buildQuranHall
    };
    const built = {};
    let currentId = null;
    let map = null;

    const player = { x: 0, z: 0, vx: 0, vz: 0, step: 0, rise: 0 };
    let yaw = 0;
    let pitch = 0;

    const held = new Set();
    const keyMap = {
      KeyW: "forward", ArrowUp: "forward",
      KeyS: "back", ArrowDown: "back",
      KeyA: "left", ArrowLeft: "left",
      KeyD: "right", ArrowRight: "right",
      ShiftLeft: "run", ShiftRight: "run"
    };

    const loading = document.getElementById("loading");
    const hint = document.getElementById("hint");

    const music = document.getElementById("music");
    const musicToggle = document.getElementById("music-toggle");
    let musicOn = true;
    if (music) music.volume = 0.6;

    function syncMusic(id = currentId) {
      if (!music) return;
      musicToggle.hidden = !id;

      if (!id || !musicOn) {
        music.pause();
      } else if (music.paused) {
        // Browsers refuse until the first click or key press; the listeners
        // below try again then.
        music.play().catch(() => {});
      }
    }

    function toggleMusic() {
      if (!music) return;
      musicOn = !musicOn;
      musicToggle.textContent = musicOn ? "Music on" : "Music off";
      musicToggle.setAttribute("aria-pressed", String(musicOn));
      syncMusic();
    }

    musicToggle?.addEventListener("click", () => {
      toggleMusic();
      canvas.focus({ preventScroll: true });
    });

    // A link straight to a hall opens with no click to start the sound.
    window.addEventListener("pointerdown", () => syncMusic());
    window.addEventListener("keydown", () => syncMusic());

    function updateWalk(dt) {
      const forward = (held.has("forward") ? 1 : 0) - (held.has("back") ? 1 : 0);
      const strafe = (held.has("right") ? 1 : 0) - (held.has("left") ? 1 : 0);
      const length = Math.hypot(forward, strafe) || 1;
      const speed = held.has("run") ? map.run : map.walk;

      const sinYaw = Math.sin(yaw);
      const cosYaw = Math.cos(yaw);
      const wantX = (-sinYaw * forward + cosYaw * strafe) / length * speed;
      const wantZ = (-cosYaw * forward - sinYaw * strafe) / length * speed;

      const ease = 1 - Math.exp(-12 * dt);
      player.vx += (wantX - player.vx) * ease;
      player.vz += (wantZ - player.vz) * ease;

      player.x += player.vx * dt;
      player.z += player.vz * dt;
      map.collide(player);
      map.collide(player);

      const moving = Math.hypot(player.vx, player.vz);
      player.step += moving * dt * 1.5;
      const bob = reducedMotion
        ? 0
        : Math.sin(player.step) * 0.035 * Math.min(moving / map.walk, 1);

      // Ease up and down steps instead of jumping to the new height.
      const ground = map.ground ? map.ground(player.x, player.z) : 0;
      player.rise += (ground - player.rise) * (1 - Math.exp(-10 * dt));

      camera.position.set(player.x, map.eye + player.rise + bob, player.z);
      camera.rotation.set(pitch, yaw, 0);
    }

    function look(dx, dy) {
      yaw -= dx * LOOK_SPEED;
      pitch = THREE.MathUtils.clamp(pitch - dy * LOOK_SPEED, -1.45, 1.45);
    }

    function backToEntrance() {
      const start = map.entrance;
      player.x = start.x;
      player.z = start.z;
      player.vx = player.vz = 0;
      yaw = start.yaw;
      pitch = start.pitch;
    }

    function lockPointer() {
      try {
        const result = canvas.requestPointerLock?.();
        result?.catch?.(() => {});
      } catch {
        // Dragging still works when the browser refuses pointer lock.
      }
    }

    const fade = document.getElementById("fade");
    const doorHint = document.getElementById("door-hint");
    let crossing = false;

    function goThroughDoor(door) {
      crossing = true;
      held.clear();
      doorHint.hidden = true;
      fade.classList.add("on");

      setTimeout(() => {
        showMap(door.to, door.arrive);
        requestAnimationFrame(() => {
          fade.classList.remove("on");
          crossing = false;
        });
      }, 260);
    }

    // ---------------------------------------------------------------------
    // Taking a book from its stand, and reading it
    // ---------------------------------------------------------------------

    const reader = document.getElementById("reader");
    const dot = document.getElementById("dot");
    const raycaster = new THREE.Raycaster();
    const REACH = 4.6;
    const CENTER = new THREE.Vector2(0, 0);

    let reading = null;   // the book that is off its stand
    let flight = null;    // its trip between the stand and your hands
    let hovered = null;
    let sheet = null;     // the note being read: { entry, page }

    function bookAt(ndc) {
      raycaster.setFromCamera(ndc, camera);
      raycaster.far = REACH * (map.eye / 2.2);
      const hit = raycaster.intersectObjects(map.books.map(book => book.mesh), false)[0];
      return hit ? map.books.find(book => book.mesh === hit.object) : null;
    }

    function setHovered(book) {
      if (hovered === book) return;
      if (hovered) hovered.hovered = false;
      hovered = book;
      if (book) book.hovered = true;
    }

    function setLabel(text) {
      if (text && doorHint.textContent !== text) doorHint.textContent = text;
      if (doorHint.hidden === Boolean(text)) doorHint.hidden = !text;
    }

    function fly(mesh, toPosition, toRotation, done) {
      flight = {
        mesh,
        fromPosition: mesh.getWorldPosition(new THREE.Vector3()),
        fromRotation: mesh.getWorldQuaternion(new THREE.Quaternion()),
        toPosition,
        toRotation,
        done,
        time: 0,
        length: reducedMotion ? 0.01 : 0.62
      };
    }

    function updateFlight(dt) {
      if (!flight) return;

      flight.time = Math.min(flight.length, flight.time + dt);
      const t = flight.time / flight.length;
      const ease = t * t * (3 - 2 * t);

      flight.mesh.position.lerpVectors(flight.fromPosition, flight.toPosition, ease);
      flight.mesh.quaternion.slerpQuaternions(flight.fromRotation, flight.toRotation, ease);

      if (t >= 1) {
        const finished = flight.done;
        flight = null;
        finished();
      }
    }

    function openBook(book) {
      reading = book;
      document.body.classList.add("reading");
      held.clear();
      setHovered(null);
      setLabel(null);
      dot.hidden = true;
      if (document.pointerLockElement) document.exitPointerLock();

      book.homePosition = book.mesh.getWorldPosition(new THREE.Vector3());
      book.homeRotation = book.mesh.getWorldQuaternion(new THREE.Quaternion());
      map.scene.attach(book.mesh);

      const facing = camera.getWorldDirection(new THREE.Vector3());
      const inHand = camera.position.clone().addScaledVector(facing, 1.15 * map.bookSize);
      const flat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);

      fly(book.mesh, inHand, camera.quaternion.clone().multiply(flat), () => showContents(book.data));
    }

    function closeBook() {
      reader.hidden = true;
      reader.textContent = "";
      sheet = null;

      const book = reading;
      fly(book.mesh, book.homePosition, book.homeRotation, () => {
        book.tray.attach(book.mesh);
        reading = null;
        document.body.classList.remove("reading");
        canvas.focus({ preventScroll: true });
      });
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function closeButton() {
      const close = element("button", "pill close", "Close book");
      close.type = "button";
      close.addEventListener("click", closeBook);
      return close;
    }

    function showContents(data) {
      sheet = null;
      reader.textContent = "";
      reader.hidden = false;

      const leaf = element("div", "leaf");
      const about = element("div", "about");

      if (data.ar) {
        const script = element("p", "script", data.ar);
        script.dir = "rtl";
        about.append(script);
      }
      about.append(element("h2", "", data.title));
      if (data.author) about.append(element("p", "by", data.author));
      if (data.subject) about.append(element("p", "subject", data.subject));
      if (data.link) {
        const source = element("a", "", "These notes on GitHub");
        source.href = data.link;
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        about.append(source);
      }

      const list = element("div", "list");
      list.append(element("h3", "", "Contents"));

      if (data.contents.length) {
        const entries = element("ol");
        data.contents.forEach(entry => {
          const row = element("li");
          const item = element(readable(entry) ? "button" : "div", readable(entry) ? "" : "plain");
          item.append(element("span", "", entry.n), element("span", "", entry.title));
          if (readable(entry)) {
            item.type = "button";
            item.addEventListener("click", () => showPage(data, entry, 0));
          }
          row.append(item);
          entries.append(row);
        });
        list.append(entries);
      } else {
        list.append(element("p", "", "No notes in this book yet."));
      }

      leaf.append(about, list);
      reader.append(leaf, closeButton());
      reader.querySelector(".close").focus({ preventScroll: true });
    }

    async function showPage(data, entry, page) {
      const request = sheet = { data, entry, page, count: 0 };
      if (!reader.querySelector(".sheet")) {
        reader.textContent = "";
        reader.append(element("p", "waiting", "Opening your notes…"), closeButton());
      }

      let pages;
      let src;

      try {
        pages = await pagesOf(entry);
        src = await pages.src(page);
      } catch {
        if (sheet !== request) return;
        reader.textContent = "";
        const failed = element("p", "waiting", "These notes would not open. Check your connection and try again.");
        const back = element("button", "pill", "Contents");
        back.type = "button";
        back.addEventListener("click", () => showContents(data));
        reader.append(failed, back, closeButton());
        return;
      }

      if (sheet !== request) return;
      request.count = pages.count;
      reader.textContent = "";

      const view = element("div", "sheet");
      const image = element("img");
      image.src = src;
      image.alt = `${entry.title}, page ${page + 1}`;

      const turn = element("div", "turn");
      const step = (label, target, enabled) => {
        const button = element("button", "pill", label);
        button.type = "button";
        button.disabled = !enabled;
        button.style.opacity = enabled ? "" : "0.4";
        button.addEventListener("click", () => showPage(data, entry, target));
        return button;
      };

      const back = element("button", "pill", "Contents");
      back.type = "button";
      back.addEventListener("click", () => showContents(data));

      turn.append(
        back,
        step("Previous", page - 1, page > 0),
        element("span", "", `${page + 1} of ${pages.count}`),
        step("Next", page + 1, page < pages.count - 1)
      );

      view.append(image, turn);
      reader.append(view, closeButton());

      for (const near of [page - 1, page + 1]) {
        if (near >= 0 && near < pages.count) {
          Promise.resolve(pages.src(near)).then(url => { new Image().src = url; }, () => {});
        }
      }
    }

    // ---------------------------------------------------------------------
    // The Quran on the stand: every verse, read a spread at a time
    // ---------------------------------------------------------------------

    const QURAN_URL = "";
    const QURAN_FONT = '"Amiri Quran", "Amiri", "Noto Naskh Arabic", serif';
    const PAGE_W = 1024;
    const PAGE_H = 1400;
    const TEXT_LEFT = 112;
    const TEXT_WIDTH = PAGE_W - TEXT_LEFT * 2;
    const TEXT_TOP = 164;
    const ROW_HEIGHT = 86;
    const PAGE_ROWS = 13;
    const VERSE_SIZE = 40;
    const TURN_TIME = 520;
    const MOST_STRETCH = 22;   // pixels between words, past which a line stays centred
    const WESTERN_TO_INDIC = "٠١٢٣٤٥٦٧٨٩";

    const indic = number => String(number).replace(/\d/g, digit => WESTERN_TO_INDIC[digit]);
    const quranReading = { quran: true };

    let quranPages = null;     // each page: { surah, number, rows: [{ kind, text, full }] }
    let quranSheets = null;    // the two canvases and textures on the 3D book
    let quranHit = [];         // meshes that open the book
    let quranSpread = 0;
    let quranStart = [];       // first page of each surah
    let quranTurning = false;
    let quranView = null;

    const measure = document.createElement("canvas").getContext("2d");

    // Pause marks sit on a no-break space so they wrap with the word before.
    // This changes how a line breaks, never the letters of the text.
    const tokensOf = (verse, number) => [
      ...verse.replace(/\s+([ۖ-ۜ])/g, " $1").split(/\s+/).filter(Boolean),
      `۝${indic(number)}`
    ];

    function paginateQuran(surahs) {
      measure.font = `${VERSE_SIZE}px ${QURAN_FONT}`;
      measure.direction = "rtl";
      const widths = new Map();
      const widthOf = token => {
        if (!widths.has(token)) widths.set(token, measure.measureText(token).width);
        return widths.get(token);
      };
      const space = measure.measureText(" ").width;

      const pages = [];
      const starts = [];
      let page = null;
      let used = 0;

      const open = surah => {
        page = { surah, number: pages.length + 1, rows: [] };
        pages.push(page);
        used = 0;
      };
      const add = (row, height = 1) => {
        page.rows.push(row);
        used += height;
      };

      surahs.forEach((surah, index) => {
        const opensWithBismillah = index !== 0 && index !== 8;
        const heading = opensWithBismillah ? 3 : 2;

        // Al-Fatiha has the first page to itself, and a title never ends a page.
        if (!page || index === 1 || used + heading + 1 > PAGE_ROWS) open(index);
        page.surah = page.rows.length ? page.surah : index;
        starts.push(pages.length - 1);

        add({ kind: "surah", text: `سورة ${surah.name}` }, 2);
        if (opensWithBismillah) add({ kind: "bismillah" });

        let line = [];
        let width = 0;
        const flush = full => {
          if (!line.length) return;
          if (used + 1 > PAGE_ROWS) open(index);
          add({ kind: "verse", text: line.join(" "), full });
          line = [];
          width = 0;
        };

        surah.verses.forEach((verse, position) => {
          const tokens = tokensOf(verse, position + 1);
          tokens.forEach((token, tokenIndex) => {
            // The verse number never starts a line on its own.
            const last = tokenIndex === tokens.length - 1;
            const glued = last && line.length;
            const next = width + (line.length ? space : 0) + widthOf(token);
            if (line.length && next > TEXT_WIDTH) {
              if (glued) {
                const carried = line.pop();
                flush(true);
                line.push(carried);
                width = widthOf(carried);
                width += space + widthOf(token);
                line.push(token);
                return;
              }
              flush(true);
              line.push(token);
              width = widthOf(token);
              return;
            }
            line.push(token);
            width = next;
          });
        });
        flush(false);
      });

      quranStart = starts;
      return pages;
    }

    function star(ctx, x, y, radius, fill) {
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const angle = i * Math.PI / 8;
        const r = i % 2 ? radius * 0.62 : radius;
        ctx[i ? "lineTo" : "moveTo"](x + Math.cos(angle) * r, y + Math.sin(angle) * r);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function paintQuranPage(canvas, index, surahs) {
      const ctx = canvas.getContext("2d");
      const W = PAGE_W;
      const H = PAGE_H;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#f2e6c9";
      ctx.fillRect(0, 0, W, H);

      const page = quranPages[index];
      if (!page) return;

      ctx.strokeStyle = "#b5862c";
      ctx.lineWidth = 10;
      ctx.strokeRect(46, 46, W - 92, H - 92);
      ctx.strokeStyle = "#16346b";
      ctx.lineWidth = 3;
      ctx.strokeRect(64, 64, W - 128, H - 128);

      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";

      // Running head and page number.
      ctx.fillStyle = "#7c5a24";
      ctx.font = `34px ${QURAN_FONT}`;
      ctx.fillText(surahs[page.surah].name, W / 2, 128);
      ctx.fillText(indic(page.number), W / 2, H - 80);

      const rowCount = page.rows.reduce((sum, row) => sum + (row.kind === "surah" ? 2 : 1), 0);
      let y = TEXT_TOP + (rowCount < 8 ? (PAGE_ROWS - rowCount) * ROW_HEIGHT / 2 : 0);

      for (const row of page.rows) {
        if (row.kind === "surah") {
          const top = y + 14;
          const band = ctx.createLinearGradient(0, top, 0, top + 112);
          band.addColorStop(0, "#1c4385");
          band.addColorStop(1, "#102a5c");
          ctx.fillStyle = band;
          ctx.fillRect(TEXT_LEFT, top, TEXT_WIDTH, 112);
          ctx.strokeStyle = "#e3b04f";
          ctx.lineWidth = 5;
          ctx.strokeRect(TEXT_LEFT, top, TEXT_WIDTH, 112);
          star(ctx, TEXT_LEFT + 58, top + 56, 28, "#e3b04f");
          star(ctx, TEXT_LEFT + TEXT_WIDTH - 58, top + 56, 28, "#e3b04f");
          ctx.fillStyle = "#f4d58a";
          ctx.font = `46px ${QURAN_FONT}`;
          ctx.wordSpacing = "0px";
          ctx.fillText(row.text, W / 2, top + 74);
          y += ROW_HEIGHT * 2;
          continue;
        }

        if (row.kind === "bismillah") {
          ctx.fillStyle = "#16346b";
          ctx.font = `${VERSE_SIZE}px ${QURAN_FONT}`;
          ctx.wordSpacing = "0px";
          ctx.fillText(surahs[0].verses[0], W / 2, y + ROW_HEIGHT - 20);
          y += ROW_HEIGHT;
          continue;
        }

        ctx.fillStyle = "#1c1410";
        ctx.font = `${VERSE_SIZE}px ${QURAN_FONT}`;
        ctx.wordSpacing = "0px";

        if (row.full && "wordSpacing" in ctx) {
          const gaps = row.text.split(" ").length - 1;
          const stretch = gaps ? (TEXT_WIDTH - ctx.measureText(row.text).width) / gaps : 0;
          if (stretch > 0 && stretch <= MOST_STRETCH) ctx.wordSpacing = `${stretch}px`;
        }

        ctx.fillText(row.text, W / 2, y + ROW_HEIGHT - 20);
        y += ROW_HEIGHT;
      }

      ctx.wordSpacing = "0px";
    }

    let quranData = null;

    function showSpreadOnStand() {
      if (!quranSheets) return;
      quranSheets.forEach((sheet, side) => {
        paintQuranPage(sheet.canvas, quranSpread * 2 + side, quranData.surahs);
        sheet.texture.needsUpdate = true;
      });
    }

    // Called by the reading room once its book exists. On the public site
    // QURAN_URL is empty and the book keeps its opening spread.
    async function attachQuran(book) {
      if (!QURAN_URL) return;

      try {
        const response = await fetch(QURAN_URL);
        if (!response.ok) return;
        quranData = await response.json();
        await document.fonts.load(`${VERSE_SIZE}px "Amiri Quran"`, "ب");
      } catch {
        return;
      }

      quranPages = paginateQuran(quranData.surahs);
      quranSheets = book.sheets;
      book.markLive();
      showSpreadOnStand();
      quranHit = book.hit;
    }

    function quranAt(ndc) {
      if (!quranHit.length) return false;
      raycaster.setFromCamera(ndc, camera);
      raycaster.far = REACH * (map.eye / 2.2);
      return raycaster.intersectObjects(quranHit, false).length > 0;
    }

    function pageCanvas(className) {
      const canvas = document.createElement("canvas");
      canvas.width = PAGE_W;
      canvas.height = PAGE_H;
      canvas.className = className;
      return canvas;
    }

    const lastSpread = () => Math.ceil(quranPages.length / 2) - 1;

    function paintView() {
      const { left, right, status, surah } = quranView;
      const first = quranSpread * 2;
      paintQuranPage(right, first, quranData.surahs);
      paintQuranPage(left, first + 1, quranData.surahs);
      const page = quranPages[first];
      status.textContent = `${first + 1} / ${quranPages.length}`;
      surah.value = String(page.surah);
    }

    function turnTo(spread) {
      const target = Math.max(0, Math.min(lastSpread(), spread));
      if (quranTurning || target === quranSpread) return;

      const forward = target > quranSpread;
      const step = Math.abs(target - quranSpread) === 1;
      const { left, right, book } = quranView;

      if (!step || reducedMotion) {
        quranSpread = target;
        paintView();
        return;
      }

      // The book reads right to left, so going forward the left leaf lifts and
      // lands on the right: its front is the page leaving, its back the new one.
      const leaf = element("div", `qr-turn ${forward ? "from-left" : "from-right"}`);
      const front = pageCanvas("qr-face");
      const back = pageCanvas("qr-face qr-back");
      leaf.append(front, back);

      const old = quranSpread * 2;
      const fresh = target * 2;
      const data = quranData.surahs;
      paintQuranPage(front, forward ? old + 1 : old, data);
      paintQuranPage(back, forward ? fresh : fresh + 1, data);

      quranTurning = true;
      if (forward) paintQuranPage(left, fresh + 1, data);
      else paintQuranPage(right, fresh, data);
      book.append(leaf);

      leaf.animate(
        [
          { transform: "rotateY(0deg)" },
          { transform: `rotateY(${forward ? 180 : -180}deg)` }
        ],
        { duration: TURN_TIME, easing: "ease-in-out", fill: "forwards" }
      );

      // A timer, since an animation in a hidden tab may never finish.
      setTimeout(() => {
        leaf.remove();
        quranSpread = target;
        if (quranView) paintView();
        quranTurning = false;
      }, TURN_TIME + 20);
    }

    function closeQuran() {
      showSpreadOnStand();
      reader.hidden = true;
      reader.textContent = "";
      reader.classList.remove("qr");
      quranView = null;
      reading = null;
      document.body.classList.remove("reading");
      canvas.focus({ preventScroll: true });
    }

    function openQuran() {
      reading = quranReading;
      document.body.classList.add("reading");
      held.clear();
      setHovered(null);
      setLabel(null);
      dot.hidden = true;
      if (document.pointerLockElement) document.exitPointerLock();

      reader.textContent = "";
      reader.classList.add("qr");

      const shell = element("div", "qr-shell");
      const book = element("div", "qr-book");
      const left = pageCanvas("qr-page");
      const right = pageCanvas("qr-page");
      book.append(left, right);

      book.addEventListener("click", event => {
        const box = book.getBoundingClientRect();
        const onLeft = event.clientX < box.left + box.width / 2;
        turnTo(quranSpread + (onLeft ? 1 : -1));
      });

      const bar = element("div", "qr-bar");

      const onward = element("button", "pill", "Next page");
      onward.type = "button";
      onward.addEventListener("click", () => turnTo(quranSpread + 1));

      const back = element("button", "pill", "Previous page");
      back.type = "button";
      back.addEventListener("click", () => turnTo(quranSpread - 1));

      const surah = document.createElement("select");
      surah.className = "qr-surah";
      surah.setAttribute("aria-label", "Go to surah");
      quranData.surahs.forEach((entry, index) => {
        const option = element("option", "", `${indic(index + 1)}. ${entry.name}`);
        option.value = String(index);
        surah.append(option);
      });
      surah.addEventListener("change", () => {
        const chosen = surah.value;
        turnTo(Math.floor(quranStart[Number(chosen)] / 2));
        surah.value = chosen;   // the spread may open on the surah before it
        surah.blur();
      });

      const status = element("span", "qr-status");

      const close = element("button", "pill", "Close");
      close.type = "button";
      close.addEventListener("click", closeQuran);

      bar.append(onward, surah, status, back, close);

      const note = element(
        "p",
        "qr-note",
        "Text: Quranic Universal Library (Tarteel), Uthmani script, with three spelling corrections at 5:52, 11:13 and 80:25. Not a certified mushaf."
      );

      shell.append(book, bar, note);
      reader.append(shell);
      reader.hidden = false;

      quranView = { left, right, book, status, surah };
      paintView();
    }

    function quranKey(event) {
      if (event.code === "ArrowLeft") turnTo(quranSpread + 1);
      if (event.code === "ArrowRight") turnTo(quranSpread - 1);
      if (event.code === "Escape") closeQuran();
    }


    function checkAim() {
      if (crossing) return;

      const locked = document.pointerLockElement === canvas;
      if (dot.hidden === locked) dot.hidden = !locked;

      const book = bookAt(CENTER);
      setHovered(book);

      if (book) setLabel(`Click to open ${book.data.title}`);
      else if (quranAt(CENTER)) setLabel("Click to read the Quran");
      else checkDoor();
    }

    function checkDoor() {
      // A door stands on a map's z or x edge; `side` is the sign of that edge.
      let label = null;

      for (const door of map.doors) {
        const side = door.side ?? 1;
        const sideways = door.axis === "x";
        const across = sideways ? player.z : player.x;
        const speed = sideways ? player.vx : player.vz;
        const reach = (sideways ? player.x : player.z) * side;
        const pastDoor = door.depth !== undefined && reach > door.edge + door.depth;

        if (Math.abs(across) < door.halfWidth + 1.2 && reach > door.edge - 2.2 && !pastDoor) label = door.label;

        if (Math.abs(across) < door.halfWidth && reach >= door.edge && speed * side > 0.2 && !pastDoor) {
          goThroughDoor(door);
          break;
        }
      }

      setLabel(label);
    }

    function ndcFrom(event) {
      return new THREE.Vector2(
        event.clientX / window.innerWidth * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
    }

    function showMap(id, arrive) {
      map = built[id] ??= builders[id]();
      currentId = id;
      renderer.toneMappingExposure = map.exposure;
      renderer.shadowMap.needsUpdate = true;
      camera.fov = map.fov;
      camera.updateProjectionMatrix();
      backToEntrance();

      if (arrive) {
        player.x = arrive.x;
        player.z = arrive.z;
        yaw = arrive.yaw;
        pitch = arrive.pitch;
      }

      if (location.hash.slice(1) !== id) location.hash = id;
      syncMusic(id);
    }

    document.addEventListener("pointerlockchange", () => {
      hint.textContent = document.pointerLockElement === canvas
        ? "W A S D to walk · Mouse to look · Shift to hurry · Esc frees the cursor"
        : "W A S D to walk · Click or drag to look · Shift to hurry";
    });

    document.addEventListener("mousemove", event => {
      if (document.pointerLockElement === canvas) {
        look(event.movementX, event.movementY);
      }
    });

    let dragPointer = null;
    let tapX = 0;
    let tapY = 0;
    let lastX = 0;
    let lastY = 0;

    canvas.addEventListener("contextmenu", event => event.preventDefault());

    canvas.addEventListener("pointerdown", event => {
      canvas.focus({ preventScroll: true });

      if (reading) return;

      // Mouse: a click opens the book you aim at, or the one under the cursor.
      if (event.pointerType === "mouse") {
        const locked = document.pointerLockElement === canvas;
        const book = bookAt(locked ? CENTER : ndcFrom(event));
        if (book) {
          openBook(book);
          return;
        }
        if (quranAt(locked ? CENTER : ndcFrom(event))) {
          openQuran();
          return;
        }
        if (!locked) lockPointer();
      }

      tapX = event.clientX;
      tapY = event.clientY;
      dragPointer = event.pointerId;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (event.pointerId !== dragPointer || document.pointerLockElement === canvas) return;

      look(event.clientX - lastX, event.clientY - lastY);
      lastX = event.clientX;
      lastY = event.clientY;
    });

    const endDrag = event => {
      if (event.pointerId === dragPointer) dragPointer = null;
    };

    // Touch: a tap that did not turn into a look-around opens a book.
    canvas.addEventListener("pointerup", event => {
      if (event.pointerType === "mouse" || reading) return;
      if (Math.hypot(event.clientX - tapX, event.clientY - tapY) > 10) return;
      const book = bookAt(ndcFrom(event));
      if (book) openBook(book);
      else if (quranAt(ndcFrom(event))) openQuran();
    });

    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    window.addEventListener("keydown", event => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;

      if (reading === quranReading) {
        quranKey(event);
        return;
      }

      if (reading) {
        if (flight) return;
        if (sheet) {
          const { data, entry, page, count } = sheet;
          if (event.code === "ArrowRight" && page < count - 1) showPage(data, entry, page + 1);
          if (event.code === "ArrowLeft" && page > 0) showPage(data, entry, page - 1);
          if (event.code === "Escape") showContents(data);
        } else if (event.code === "Escape") {
          closeBook();
        }
        return;
      }

      if (event.code === "KeyN") {
        toggleMusic();
        return;
      }

      if (event.code === "KeyR") {
        backToEntrance();
        return;
      }

      const action = keyMap[event.code];
      if (!action) return;

      event.preventDefault();
      held.add(action);
    });

    window.addEventListener("keyup", event => {
      const action = keyMap[event.code];
      if (action) held.delete(action);
    });

    // A key released in another window never sends keyup here.
    window.addEventListener("blur", () => held.clear());

    // On-screen pad for touch screens.
    document.querySelectorAll("#pad button").forEach(button => {
      const action = button.dataset.action;
      const release = () => held.delete(action);

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        held.add(action);
      });
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // The walk starts in Cordoba; #reading-room opens the other hall directly.
    function followHash() {
      const id = location.hash.slice(1);
      if (builders[id] && id !== currentId) showMap(id);
    }

    window.addEventListener("hashchange", followHash);
    showMap(builders[location.hash.slice(1)] ? location.hash.slice(1) : "cordoba");
    document.getElementById("loading").hidden = true;

    // The controls and credit show for the first 30 seconds only.
    setTimeout(() => {
      document.querySelectorAll(".fades").forEach(item => item.classList.add("gone"));
    }, 30000);

    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const delta = clock.getDelta();
      if (!map) return;

      map.update(clock.elapsedTime);
      updateFlight(Math.min(delta, 0.05));

      if (!reading) {
        updateWalk(Math.min(delta, 0.05));
        checkAim();
      }

      renderer.render(map.scene, camera);
    });
  </script>

</body>
</html>
