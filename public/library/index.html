      const books = placeBooks(scene, "reading-room", bookSpots, 1.28);

      // Candle fill low in the room, so the dais and desks stay readable.
      for (const z of [-6.5, 6.5]) {
        const fill = new THREE.PointLight(0xffb066, 34, 16, 2);
        fill.position.set(0, 2.6, z);
        scene.add(fill);
      }

      const SHELF_LIMIT = 16.2;
      const BODY_RADIUS = 0.45;
      const DESK_HALF_WIDTH = 1.66;
      const DESK_HALF_LENGTH = 2.13;

      const desks = [];
      for (let i = 0; i < 8; i++) {
        const angle = i * TAU / 8 + Math.PI / 8;
        desks.push({
          x: Math.sin(angle) * 8.35,
          z: Math.cos(angle) * 8.35,
          cos: Math.cos(angle),
          sin: Math.sin(angle)
        });
      }

      function collideDesk(player, desk) {
        const dx = player.x - desk.x;
        const dz = player.z - desk.z;

        // Work in the desk's own axes, where it is a plain rectangle.
        const localX = dx * desk.cos - dz * desk.sin;
        const localZ = dx * desk.sin + dz * desk.cos;

        const nearX = THREE.MathUtils.clamp(localX, -DESK_HALF_WIDTH, DESK_HALF_WIDTH);
        const nearZ = THREE.MathUtils.clamp(localZ, -DESK_HALF_LENGTH, DESK_HALF_LENGTH);
        const gapX = localX - nearX;
        const gapZ = localZ - nearZ;
        const gap = Math.hypot(gapX, gapZ);

        if (gap >= BODY_RADIUS) return;

        let pushX;
        let pushZ;

        if (gap > 0) {
          pushX = gapX / gap * (BODY_RADIUS - gap);
          pushZ = gapZ / gap * (BODY_RADIUS - gap);
        } else {
          // Centre is inside the rectangle: leave by the nearest side.
          const roomX = DESK_HALF_WIDTH - Math.abs(localX);
          const roomZ = DESK_HALF_LENGTH - Math.abs(localZ);
          pushX = roomX < roomZ ? Math.sign(localX || 1) * (roomX + BODY_RADIUS) : 0;
          pushZ = roomX < roomZ ? 0 : Math.sign(localZ || 1) * (roomZ + BODY_RADIUS);
        }

        player.x += pushX * desk.cos + pushZ * desk.sin;
        player.z += -pushX * desk.sin + pushZ * desk.cos;
      }

      function collide(player) {
        desks.forEach(desk => collideDesk(player, desk));

        for (const [x, z] of bookSpots.slice(0, books.length)) {
          const dx = player.x - x;
          const dz = player.z - z;
          const gap = Math.hypot(dx, dz) || 0.0001;
          if (gap < 1.05) {
            player.x = x + dx / gap * 1.05;
            player.z = z + dz / gap * 1.05;
          }
        }

        const distance = Math.hypot(player.x, player.z) || 0.0001;

        if (distance > SHELF_LIMIT) {
          player.x *= SHELF_LIMIT / distance;
          player.z *= SHELF_LIMIT / distance;
        }
      }

      return {
        scene,
        exposure: 1.12,
        fov: 46,
        eye: 2.75,          // a desk is 1.4 units tall, so a metre is about 1.8 units
        walk: 5.5,
        run: 10,
        entrance: { x: 0, z: 15, yaw: 0, pitch: 0.08 },
        books,
        bookSize: 1.28,
        doors: [
          {
            edge: 16.1,
            halfWidth: 1.2,
            to: "cordoba",
            label: "Door to the Library of Cordoba: walk into it",
            arrive: { x: 0.8, z: 7.1, yaw: -0.3, pitch: 0.06 }
          },
          {
            side: -1,
            edge: 16.1,
            halfWidth: 1.2,
            to: "house-of-wisdom",
            label: "Door to the House of Wisdom: walk into it"
          },
          {
            axis: "x",
            edge: 16.1,
            halfWidth: 1.2,
            to: "quran-hall",
            label: "Door to the Hall of the Quran: walk into it"
          }
        ],
        collide,
        update(elapsed) {
          dust.rotation.y = elapsed * 0.009;
          materials.bulb.emissiveIntensity = 3.0 + Math.sin(elapsed * 1.4) * 0.12;
          moveCandles(elapsed);
          pulseBooks(books, elapsed);
        }
      };
    }

    // ---------------------------------------------------------------------
    // Map: Library of Cordoba
    // ---------------------------------------------------------------------

    function buildCordoba() {
const scene = new THREE.Scene();

const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    let randomSeed = 84271;

    function random() {
      randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
      return randomSeed / 4294967296;
    }

    function makeTexture(size, painter, repeatX = 1, repeatY = 1) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const context = canvas.getContext("2d");
      painter(context, size);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.anisotropy = maxAnisotropy;
      return texture;
    }

    const marbleTexture = makeTexture(256, (ctx, size) => {
      ctx.fillStyle = "#e9e1cf";
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < 24; i++) {
        const x = random() * size;
        const bend = (random() - 0.5) * 38;

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.bezierCurveTo(
          x + bend, size * 0.3,
          x - bend * 0.7, size * 0.7,
          x + (random() - 0.5) * 24, size
        );
        ctx.strokeStyle = `rgba(111, 91, 70, ${0.035 + random() * 0.09})`;
        ctx.lineWidth = 0.5 + random() * 1.8;
        ctx.stroke();
      }

      for (let i = 0; i < 70; i++) {
        const x = random() * size;
        const y = random() * size;
        const radius = 1 + random() * 5;

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(112, 94, 70, ${0.015 + random() * 0.045})`;
        ctx.fill();
      }
    }, 2, 2);

    const floorTexture = makeTexture(512, (ctx, size) => {
      ctx.fillStyle = "#b8a88b";
      ctx.fillRect(0, 0, size, size);

      const tile = 64;

      for (let y = 0; y < size; y += tile) {
        for (let x = 0; x < size; x += tile) {
          const shade = 166 + Math.floor(random() * 22);
          ctx.fillStyle = `rgb(${shade}, ${shade - 8}, ${shade - 22})`;
          ctx.fillRect(x + 2, y + 2, tile - 4, tile - 4);
        }
      }

      ctx.strokeStyle = "rgba(78, 67, 51, 0.38)";
      ctx.lineWidth = 2;

      for (let i = 0; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tile, 0);
        ctx.lineTo(i * tile, size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tile);
        ctx.lineTo(size, i * tile);
        ctx.stroke();
      }

      for (let i = 0; i < 1400; i++) {
        const alpha = 0.015 + random() * 0.035;
        ctx.fillStyle = `rgba(55, 42, 28, ${alpha})`;
        ctx.fillRect(random() * size, random() * size, 1 + random() * 2, 1 + random() * 2);
      }
    }, 4, 3);

    const woodTexture = makeTexture(256, (ctx, size) => {
      ctx.fillStyle = "#765033";
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < 95; i++) {
        const y = random() * size;
        const amplitude = 1 + random() * 7;

        ctx.beginPath();
        ctx.moveTo(0, y);

        for (let x = 0; x <= size; x += 16) {
          ctx.lineTo(x, y + Math.sin(x * 0.035 + i) * amplitude);
        }

        ctx.strokeStyle = `rgba(${40 + random() * 35}, ${20 + random() * 18}, 10, ${0.08 + random() * 0.22})`;
        ctx.lineWidth = 0.5 + random() * 2.2;
        ctx.stroke();
      }
    }, 2, 2);

    const carpetTexture = makeTexture(512, (ctx, size) => {
      ctx.fillStyle = "#681f2b";
      ctx.fillRect(0, 0, size, size);

      const inset = 34;

      ctx.strokeStyle = "#c89b55";
      ctx.lineWidth = 6;
      ctx.strokeRect(inset, inset, size - inset * 2, size - inset * 2);
      ctx.lineWidth = 2;
      ctx.strokeRect(inset + 9, inset + 9, size - inset * 2 - 18, size - inset * 2 - 18);
      ctx.lineWidth = 3;
      ctx.strokeRect(inset + 15, inset + 15, size - inset * 2 - 30, size - inset * 2 - 30);

      ctx.save();
      ctx.translate(size / 2, size / 2);

      for (let ring = 0; ring < 5; ring++) {
        const radius = 55 + ring * 29;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius, radius * 1.12, 0, 0, Math.PI * 2);
        ctx.strokeStyle = ring % 2 ? "#b8793d" : "#8e303c";
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, 22, 34, 0, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 ? "#b8793d" : "#8e303c";
        ctx.fill();
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fillStyle = "#b8793d";
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = "rgba(224, 188, 113, 0.55)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 80; i++) {
        const x = random() * size;
        const y = random() * size;
        ctx.beginPath();
        ctx.arc(x, y, 1 + random() * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }, 1.35, 1.35);

    const stripeTexture = makeTexture(256, (ctx, size) => {
      ctx.fillStyle = "#f0e6d3";
      ctx.fillRect(0, 0, size, size);

      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, "#8f2f38");
      gradient.addColorStop(0.48, "#b94850");
      gradient.addColorStop(0.5, "#d96b70");
      gradient.addColorStop(0.52, "#74262f");
      gradient.addColorStop(1, "#a83b43");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = "rgba(247, 235, 210, 0.9)";
      ctx.lineWidth = 5;

      for (let x = -72; x < size + 72; x += 64) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 64, size);
        ctx.stroke();
      }

      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(73, 35, 42, 0.55)";
      ctx.strokeRect(12, 12, size - 24, size - 24);
    }, 0.45, 0.35);

    const materials = {
      marble: new THREE.MeshStandardMaterial({
        map: marbleTexture,
        color: 0xfff4df,
        roughness: 0.48,
        metalness: 0.02
      }),
      paleStone: new THREE.MeshStandardMaterial({
        color: 0xd8cbb1,
        roughness: 0.8
      }),
      darkStone: new THREE.MeshStandardMaterial({
        color: 0x695e50,
        roughness: 0.9
      }),
      floor: new THREE.MeshStandardMaterial({
        map: floorTexture,
        roughness: 0.92
      }),
      wood: new THREE.MeshStandardMaterial({
        map: woodTexture,
        color: 0x8a5d3c,
        roughness: 0.76
      }),
      darkWood: new THREE.MeshStandardMaterial({
        map: woodTexture,
        color: 0x513323,
        roughness: 0.82
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0x87303b,
        roughness: 0.76
      }),
      brass: new THREE.MeshStandardMaterial({
        color: 0xb68b3d,
        metalness: 0.88,
        roughness: 0.25
      }),
      gold: new THREE.MeshStandardMaterial({
        color: 0xd3a65d,
        metalness: 0.72,
        roughness: 0.32
      }),
      glass: new THREE.MeshStandardMaterial({
        color: 0xffbd62,
        emissive: 0xff842c,
        emissiveIntensity: 1.5,
        transparent: true,
        opacity: 0.86,
        roughness: 0.22,
        metalness: 0.05
      }),
      water: new THREE.MeshStandardMaterial({
        color: 0x69b9c5,
        emissive: 0x164b55,
        emissiveIntensity: 0.35,
        metalness: 0.28,
        roughness: 0.16
      }),
      leaf: new THREE.MeshStandardMaterial({
        color: 0x426838,
        roughness: 0.9
      }),
      leafLight: new THREE.MeshStandardMaterial({
        color: 0x668243,
        roughness: 0.9
      }),
      orange: new THREE.MeshStandardMaterial({
        color: 0xe98528,
        roughness: 0.58
      }),
      carpet: new THREE.MeshStandardMaterial({
        map: carpetTexture,
        roughness: 0.96
      })
    };

    function addBox(width, height, depth, material, x = 0, y = 0, z = 0, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(
      radiusTop,
      radiusBottom,
      height,
      material,
      x = 0,
      y = 0,
      z = 0,
      parent = scene,
      segments = 24
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addSphere(radius, material, x = 0, y = 0, z = 0, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 18, 12),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addTorus(radius, tube, material, x = 0, y = 0, z = 0, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(radius, tube, 10, 48),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinderBetween(start, end, radius, material, parent = scene) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, 8),
        material
      );

      mesh.position.copy(midpoint);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function flutedShaftGeometry(radiusBottom, radiusTop, height, flutes = 16) {
      const radialSegments = 36;
      const verticalSegments = 20;
      const positions = [];
      const indices = [];

      for (let iy = 0; iy <= verticalSegments; iy++) {
        const t = iy / verticalSegments;
        const y = -height / 2 + t * height;
        const baseRadius = THREE.MathUtils.lerp(radiusBottom, radiusTop, t);

        for (let ix = 0; ix <= radialSegments; ix++) {
          const angle = (ix / radialSegments) * Math.PI * 2;
          const flute = 1 - 0.055 * (0.5 + 0.5 * Math.cos(flutes * angle));
          const radius = baseRadius * flute;

          positions.push(
            Math.cos(angle) * radius,
            y,
            Math.sin(angle) * radius
          );
        }
      }

      for (let iy = 0; iy < verticalSegments; iy++) {
        for (let ix = 0; ix < radialSegments; ix++) {
          const a = iy * (radialSegments + 1) + ix;
          const b = a + radialSegments + 1;
          const c = b + 1;
          const d = a + 1;

          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    // ---------------------------------------------------------------------
    // Halls rebuilt for walking: a closed court ringed by a real gallery
    // ---------------------------------------------------------------------

    const CEILING = 7.25;
    const BAY = 2.9;              // column spacing on all four sides
    const COURT_X = 8.7;
    const COURT_Z = 5.8;
    const IMPOST = 4.6;           // top of the capitals; the arches spring here
    const ARCH_TOP = 7.35;
    const WALL_X = 12.1;
    const WALL_Z = 9.1;

    addDuskSky(scene);
    scene.fog = new THREE.Fog(0x171320, 34, 90);

    const tileTexture = makeTexture(128, (ctx, size) => {
      ctx.fillStyle = "#e8dcc2";
      ctx.fillRect(0, 0, size, size);

      // An eight-pointed star of two overlapping squares, the zellij motif.
      const star = (cx, cy, r, fill) => {
        ctx.fillStyle = fill;
        for (const turn of [0, Math.PI / 4]) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(turn);
          ctx.fillRect(-r, -r, r * 2, r * 2);
          ctx.restore();
        }
      };

      star(size / 2, size / 2, 34, "#1f5c63");
      star(size / 2, size / 2, 20, "#c89b55");
      star(size / 2, size / 2, 9, "#87303b");
      for (const x of [0, size]) {
        for (const y of [0, size]) star(x, y, 14, "#87303b");
      }
    });

    const tileMaterial = new THREE.MeshStandardMaterial({
      map: tileTexture,
      roughness: 0.42
    });

    // Floor and base.
    floorTexture.repeat.set(5.4, 4);
    addBox(25.2, 0.3, 19.2, materials.darkStone, 0, -0.18, 0);

    const paving = new THREE.Mesh(
      new THREE.PlaneGeometry(24.4, 18.4),
      materials.floor
    );
    paving.rotation.x = -Math.PI / 2;
    paving.position.y = 0.012;
    paving.receiveShadow = true;
    scene.add(paving);

    // Outer walls.
    addBox(24.6, 7.6, 0.4, materials.paleStone, 0, 3.8, -WALL_Z);
    addBox(24.6, 7.6, 0.4, materials.paleStone, 0, 3.8, WALL_Z);
    addBox(0.4, 7.6, 18.6, materials.paleStone, -WALL_X, 3.8, 0);
    addBox(0.4, 7.6, 18.6, materials.paleStone, WALL_X, 3.8, 0);

    // A band of star tiles above the bookcases.
    function addFrieze(width, x, z, rotationY) {
      const geometry = new THREE.PlaneGeometry(width, 0.9);
      const uv = geometry.attributes.uv;
      for (let i = 0; i < uv.count; i++) {
        uv.setXY(i, uv.getX(i) * width / 0.9, uv.getY(i));
      }
      const frieze = new THREE.Mesh(geometry, tileMaterial);
      frieze.position.set(x, 5.3, z);
      frieze.rotation.y = rotationY;
      frieze.receiveShadow = true;
      scene.add(frieze);

      const rail = new THREE.Mesh(new THREE.PlaneGeometry(width, 0.1), materials.gold);
      rail.position.set(x, 4.8, z);
      rail.rotation.y = rotationY;
      scene.add(rail);
    }

    addFrieze(23.8, 0, -WALL_Z + 0.21, 0);
    addFrieze(23.8, 0, WALL_Z - 0.21, Math.PI);
    addFrieze(17.8, -WALL_X + 0.21, 0, Math.PI / 2);
    addFrieze(17.8, WALL_X - 0.21, 0, -Math.PI / 2);

    // The door to the Grand Reading Room, behind where the visitor starts.
    addHorseshoeDoor(scene, WALL_Z - 0.3, 0.88);

    // Gallery ceilings: boards with exposed beams.
    addBox(24.4, 0.2, 3.3, materials.wood, 0, CEILING + 0.1, -7.45);
    addBox(24.4, 0.2, 3.3, materials.wood, 0, CEILING + 0.1, 7.45);
    addBox(3.4, 0.2, 11.6, materials.wood, -10.4, CEILING + 0.1, 0);
    addBox(3.4, 0.2, 11.6, materials.wood, 10.4, CEILING + 0.1, 0);

    // Instanced parts: twenty arches of the same size share their geometry.
    function instanced(geometry, material, matrices) {
      const mesh = new THREE.InstancedMesh(geometry, material, matrices.length);
      matrices.forEach((matrix, index) => mesh.setMatrixAt(index, matrix));
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.frustumCulled = false;
      scene.add(mesh);
      return mesh;
    }

    const beams = [];
    const beamAt = (x, z, rotationY) => new THREE.Matrix4().compose(
      new THREE.Vector3(x, CEILING - 0.1, z),
      new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotationY),
      new THREE.Vector3(1, 1, 1)
    );

    for (let x = -11.2; x <= 11.2; x += 1.6) {
      beams.push(beamAt(x, -7.45, 0), beamAt(x, 7.45, 0));
    }
    for (let z = -4.8; z <= 4.8; z += 1.6) {
      beams.push(beamAt(-10.4, z, Math.PI / 2), beamAt(10.4, z, Math.PI / 2));
    }
    instanced(new THREE.BoxGeometry(0.2, 0.22, 3.3), materials.darkWood, beams);

    // Columns on a single 2.9 unit grid, corners included.
    const columnPositions = [];
    for (const x of [-COURT_X, COURT_X]) {
      for (let i = -2; i <= 2; i++) columnPositions.push([x, i * BAY]);
    }
    for (const z of [-COURT_Z, COURT_Z]) {
      for (let i = -2; i <= 2; i++) columnPositions.push([i * BAY, z]);
    }

    const shaftGeometry = flutedShaftGeometry(0.31, 0.36, 3.92, 16);

    function makeColumn(x, z) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      scene.add(group);

      addCylinder(0.48, 0.55, 0.24, materials.paleStone, 0, 0.12, 0, group);
      addTorus(0.4, 0.065, materials.marble, 0, 0.25, 0, group).rotation.x = Math.PI / 2;

      const shaft = new THREE.Mesh(shaftGeometry, materials.marble);
      shaft.position.y = 2.24;
      shaft.castShadow = true;
      shaft.receiveShadow = true;
      group.add(shaft);

      addCylinder(0.44, 0.37, 0.14, materials.marble, 0, 4.29, 0, group);
      addBox(0.75, 0.18, 0.75, materials.marble, 0, 4.45, 0, group);
    }

    columnPositions.forEach(([x, z]) => makeColumn(x, z));

    // Horseshoe arches: the circle runs 30 degrees past the semicircle, so
    // the opening narrows to the width between the capitals at the impost.
    const OVERSHOOT = Math.PI / 6;
    const ARCH_RADIUS = (BAY / 2 - 0.3) / Math.cos(OVERSHOOT);
    const ARCH_CENTER = IMPOST + ARCH_RADIUS * Math.sin(OVERSHOOT);
    const VOUSSOIR_DEPTH = 0.42;
    const VOUSSOIRS = 15;

    const wallShape = new THREE.Shape();
    const chord = ARCH_RADIUS * Math.cos(OVERSHOOT);
    wallShape.moveTo(-BAY / 2, IMPOST);
    wallShape.lineTo(-chord, IMPOST);
    wallShape.absarc(0, ARCH_CENTER, ARCH_RADIUS, Math.PI + OVERSHOOT, -OVERSHOOT, true);
    wallShape.lineTo(BAY / 2, IMPOST);
    wallShape.lineTo(BAY / 2, ARCH_TOP);
    wallShape.lineTo(-BAY / 2, ARCH_TOP);
    wallShape.closePath();

    const wallGeometry = new THREE.ExtrudeGeometry(wallShape, {
      depth: 0.5,
      bevelEnabled: false,
      curveSegments: 32
    });
    wallGeometry.translate(0, 0, -0.25);

    // One wedge of the striped ring, pointing along +x.
    const sweep = (Math.PI + OVERSHOOT * 2) / VOUSSOIRS;
    const wedgeShape = new THREE.Shape();
    wedgeShape.absarc(0, 0, ARCH_RADIUS, -sweep / 2 + 0.006, sweep / 2 - 0.006, false);
    wedgeShape.absarc(0, 0, ARCH_RADIUS + VOUSSOIR_DEPTH, sweep / 2 - 0.006, -sweep / 2 + 0.006, true);
    wedgeShape.closePath();

    const wedgeGeometry = new THREE.ExtrudeGeometry(wedgeShape, {
      depth: 0.58,
      bevelEnabled: false,
      curveSegments: 4
    });
    wedgeGeometry.translate(0, 0, -0.29);

    const bays = [];
    for (let i = 0; i < 6; i++) {
      const x = -COURT_X + BAY / 2 + i * BAY;
      bays.push([x, -COURT_Z, 0], [x, COURT_Z, 0]);
    }
    for (let i = 0; i < 4; i++) {
      const z = -COURT_Z + BAY / 2 + i * BAY;
      bays.push([-COURT_X, z, Math.PI / 2], [COURT_X, z, Math.PI / 2]);
    }

    const walls = [];
    const redStones = [];
    const whiteStones = [];

    for (const [x, z, rotationY] of bays) {
      const bay = new THREE.Matrix4().makeRotationY(rotationY).setPosition(x, 0, z);
      walls.push(bay);

      for (let i = 0; i < VOUSSOIRS; i++) {
        const angle = -OVERSHOOT + sweep * (i + 0.5);
        const stone = new THREE.Matrix4()
          .makeTranslation(0, ARCH_CENTER, 0)
          .multiply(new THREE.Matrix4().makeRotationZ(angle));
        (i % 2 ? whiteStones : redStones).push(bay.clone().multiply(stone));
      }
    }

    const stucco = new THREE.MeshStandardMaterial({ color: 0xe6d8bb, roughness: 0.82 });
    instanced(wallGeometry, stucco, walls);
    instanced(wedgeGeometry, materials.red, redStones);
    instanced(wedgeGeometry, new THREE.MeshStandardMaterial({ color: 0xf0e6d3, roughness: 0.6 }), whiteStones);

    // Cornice and stepped merlons around the court.
    addBox(18.2, 0.2, 0.9, materials.marble, 0, 7.45, -COURT_Z);
    addBox(18.2, 0.2, 0.9, materials.marble, 0, 7.45, COURT_Z);
    addBox(0.9, 0.2, 11.6, materials.marble, -COURT_X, 7.45, 0);
    addBox(0.9, 0.2, 11.6, materials.marble, COURT_X, 7.45, 0);

    // ---------------------------------------------------------------------
    // Roof after the Hall of Ambassadors in the Alcazar of Seville: a gilded
    // half-orange dome of interlaced stars on a window drum, set in a coffered
    // cedar ceiling
    // ---------------------------------------------------------------------

    const ATTIC_TOP = 8.35;
    const DOME_RADIUS = 5.2;
    const DRUM_TOP = 9.75;
    const TAU = Math.PI * 2;

    // Outline of an eight-pointed star (or more), centred on the origin.
    function starPoints(radius, points = 8, waist = 0.62) {
      const outline = [];
      for (let i = 0; i < points * 2; i++) {
        const angle = i * Math.PI / points;
        const r = i % 2 ? radius * waist : radius;
        outline.push([Math.cos(angle) * r, Math.sin(angle) * r]);
      }
      return outline;
    }

    function tracePath(ctx, outline) {
      ctx.beginPath();
      outline.forEach(([x, y], index) => (index ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
    }

    // Coffered cedar: one tile covers one 2.9 unit bay.
    const cofferTexture = makeTexture(512, (ctx, size) => {
      ctx.fillStyle = "#3b2013";
      ctx.fillRect(0, 0, size, size);

      const shift = (x, y, outline) => outline.map(([px, py]) => [px + x, py + y]);

      ctx.lineJoin = "round";
      for (const [x, y] of [[0, 0], [size, 0], [0, size], [size, size], [size / 2, size / 2]]) {
        tracePath(ctx, shift(x, y, starPoints(size * 0.3)));
        ctx.fillStyle = "#1f3f52";
        ctx.fill();
        ctx.strokeStyle = "#e0b45c";
        ctx.lineWidth = 11;
        ctx.stroke();

        tracePath(ctx, shift(x, y, starPoints(size * 0.13, 8, 0.7)));
        ctx.fillStyle = "#d8a84e";
        ctx.fill();
      }

      for (const [x, y] of [[size / 2, 0], [0, size / 2], [size, size / 2], [size / 2, size]]) {
        tracePath(ctx, shift(x, y, starPoints(size * 0.16)));
        ctx.fillStyle = "#7a2230";
        ctx.fill();
        ctx.strokeStyle = "#e0b45c";
        ctx.lineWidth = 7;
        ctx.stroke();
      }
    });
    cofferTexture.repeat.set(1 / BAY, 1 / BAY);

    const cofferMaterial = new THREE.MeshStandardMaterial({
      map: cofferTexture,
      roughness: 0.55,
      metalness: 0.15,
      emissive: 0x2a1a0c,
      emissiveMap: cofferTexture,
      side: THREE.DoubleSide
    });

    // Gold lattice painted in latitude and longitude, so rings of stars keep
    // their shape and thin out towards the crown as they do in Seville.
    function makeDomeTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 4096;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      const ground = ctx.createLinearGradient(0, 0, 0, H);
      ground.addColorStop(0, "#d9a441");
      ground.addColorStop(1, "#8f5f1d");
      ctx.fillStyle = ground;
      ctx.fillRect(0, 0, W, H);

      const toCanvas = (lon, lat) => [W * lon / TAU, H * (1 - lat / (Math.PI / 2))];
      const onDome = (lon, lat, outline) => outline.map(([x, y]) =>
        toCanvas(lon + x / Math.max(Math.cos(lat), 0.12), lat + y));

      ctx.lineJoin = "round";
      const step = 0.2;

      for (let row = 0; row * step < 1.25; row++) {
        const lat = 0.1 + row * step;
        const count = 4 * Math.round(TAU * Math.cos(lat) / step / 4);

        for (let i = 0; i < count; i++) {
          const lon = (i + (row % 2 ? 0.5 : 0)) * TAU / count;

          for (const wrap of [-TAU, 0, TAU]) {
            tracePath(ctx, onDome(lon + wrap, lat, starPoints(step * 0.64)));
            ctx.fillStyle = row % 2 ? "#b8842c" : "#a8741f";
            ctx.fill();
            ctx.strokeStyle = "#ffe29a";
            ctx.lineWidth = 7;
            ctx.stroke();

            tracePath(ctx, onDome(lon + wrap, lat, starPoints(step * 0.27, 8, 0.7)));
            ctx.fillStyle = (i + row) % 2 ? "#7a2230" : "#1f3f52";
            ctx.fill();
            ctx.strokeStyle = "#ffe29a";
            ctx.lineWidth = 3;
            ctx.stroke();
          }
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.anisotropy = maxAnisotropy;
      return texture;
    }

    const domeTexture = makeDomeTexture();

    const gildedMaterial = texture => new THREE.MeshStandardMaterial({
      map: texture,
      bumpMap: texture,
      bumpScale: 1.2,
      emissive: 0x6b4312,
      emissiveMap: texture,
      metalness: 0.35,
      roughness: 0.42,
      side: THREE.BackSide,
      shadowSide: THREE.DoubleSide
    });

    // Attic above the arches, with a band of the same star tiles.
    addBox(19, 0.8, 0.6, stucco, 0, 7.95, -COURT_Z - 0.2);
    addBox(19, 0.8, 0.6, stucco, 0, 7.95, COURT_Z + 0.2);
    addBox(0.6, 0.8, 12.6, stucco, -COURT_X - 0.2, 7.95, 0);
    addBox(0.6, 0.8, 12.6, stucco, COURT_X + 0.2, 7.95, 0);

    function addAtticTiles(width, x, z, rotationY) {
      const geometry = new THREE.PlaneGeometry(width, 0.62);
      const uv = geometry.attributes.uv;
      for (let i = 0; i < uv.count; i++) {
        uv.setXY(i, uv.getX(i) * width / 0.62, uv.getY(i));
      }
      const band = new THREE.Mesh(geometry, tileMaterial);
      band.position.set(x, 7.96, z);
      band.rotation.y = rotationY;
      scene.add(band);
    }

    addAtticTiles(17.3, 0, -COURT_Z + 0.12, 0);
    addAtticTiles(17.3, 0, COURT_Z - 0.12, Math.PI);
    addAtticTiles(11.5, -COURT_X + 0.12, 0, Math.PI / 2);
    addAtticTiles(11.5, COURT_X - 0.12, 0, -Math.PI / 2);

    // Coffered ceiling with a round opening for the drum.
    const ceilingShape = new THREE.Shape();
    ceilingShape.moveTo(-9.4, -6.5);
    ceilingShape.lineTo(9.4, -6.5);
    ceilingShape.lineTo(9.4, 6.5);
    ceilingShape.lineTo(-9.4, 6.5);
    ceilingShape.closePath();

    const drumOpening = new THREE.Path();
    drumOpening.absarc(0, 0, DOME_RADIUS, 0, TAU, true);
    ceilingShape.holes.push(drumOpening);

    const ceilingGeometry = new THREE.ExtrudeGeometry(ceilingShape, {
      depth: 0.3,
      bevelEnabled: false,
      curveSegments: 64
    });
    ceilingGeometry.rotateX(Math.PI / 2);

    const courtCeiling = new THREE.Mesh(ceilingGeometry, cofferMaterial);
    courtCeiling.position.y = ATTIC_TOP + 0.3;
    courtCeiling.castShadow = true;
    scene.add(courtCeiling);

    // Window drum: twenty-four piers, with open sky between them.
    const piers = [];
    for (let i = 0; i < 24; i++) {
      const angle = i * TAU / 24;
      piers.push(new THREE.Matrix4().compose(
        new THREE.Vector3(Math.sin(angle) * 5.3, (ATTIC_TOP + DRUM_TOP) / 2 + 0.1, Math.cos(angle) * 5.3),
        new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle),
        new THREE.Vector3(1, 1, 1)
      ));
    }
    instanced(
      new THREE.BoxGeometry(0.74, DRUM_TOP - ATTIC_TOP - 0.1, 0.44),
      materials.gold,
      piers
    );

    for (const y of [ATTIC_TOP + 0.02, DRUM_TOP]) {
      addTorus(DOME_RADIUS, 0.13, materials.gold, 0, y, 0).rotation.x = Math.PI / 2;
    }

    // The half-orange itself.
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(DOME_RADIUS + 0.25, 96, 48, 0, TAU, 0, Math.PI / 2),
      gildedMaterial(domeTexture)
    );
    dome.position.y = DRUM_TOP;
    dome.castShadow = true;
    scene.add(dome);

    // Sixteen-pointed star at the crown, drawn flat and laid over the top.
    const crownTexture = makeTexture(512, (ctx, size) => {
      ctx.fillStyle = "#a8741f";
      ctx.fillRect(0, 0, size, size);
      ctx.translate(size / 2, size / 2);
      ctx.lineJoin = "round";

      for (const [radius, fill] of [
        [size * 0.5, "#c9973a"],
        [size * 0.36, "#7a2230"],
        [size * 0.22, "#1f3f52"],
        [size * 0.1, "#ffe29a"]
      ]) {
        tracePath(ctx, starPoints(radius, 16, 0.76));
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = "#ffe29a";
        ctx.lineWidth = 6;
        ctx.stroke();
      }
    });

    const CROWN_ANGLE = 0.4;
    const crownGeometry = new THREE.SphereGeometry(DOME_RADIUS + 0.22, 64, 8, 0, TAU, 0, CROWN_ANGLE);
    const crownPositions = crownGeometry.attributes.position;
    const crownUv = crownGeometry.attributes.uv;
    const crownSpan = (DOME_RADIUS + 0.22) * Math.sin(CROWN_ANGLE) * 2;
    for (let i = 0; i < crownPositions.count; i++) {
      crownUv.setXY(
        i,
        0.5 + crownPositions.getX(i) / crownSpan,
        0.5 + crownPositions.getZ(i) / crownSpan
      );
    }

    const crown = new THREE.Mesh(crownGeometry, gildedMaterial(crownTexture));
    crown.position.y = DRUM_TOP;
    scene.add(crown);

    // Unseen candlelight under the dome.
    const CANDLE_RING = 6.75;
    const domeGlow = new THREE.PointLight(0xffc27a, 165, 34, 2);
    domeGlow.position.set(0, CANDLE_RING - 1.5, 0);
    scene.add(domeGlow);


    const bookGeometry = new THREE.BoxGeometry(1, 1, 1);
    const bookMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.8
    });

    function makeBookcase(x, z, rotationY) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotationY;
      scene.add(group);

      addBox(3.45, 3.2, 0.08, materials.darkWood, 0, 1.7, -0.27, group);
      addBox(0.13, 3.25, 0.58, materials.wood, -1.63, 1.7, 0, group);
      addBox(0.13, 3.25, 0.58, materials.wood, 1.63, 1.7, 0, group);

      const shelfHeights = [0.28, 1.08, 1.88, 2.68, 3.34];

      for (const y of shelfHeights) {
        addBox(3.48, 0.1, 0.59, materials.wood, 0, y, 0, group);
      }

      addBox(3.7, 0.13, 0.7, materials.darkWood, 0, 3.43, 0.015, group);

      const bookTransforms = [];
      const bookColors = [
        0x8b333d,
        0x355b62,
        0x40503a,
        0x75513b,
        0x9c7236,
        0x3e3155,
        0x6c4931,
        0x36584a,
        0xa26c3d,
        0x77343e
      ];

      for (let row = 0; row < 4; row++) {
        const shelfY = shelfHeights[row] + 0.07;

        for (let bay = 0; bay < 4; bay++) {
          const bayX = -1.05 + bay * 0.7;

          for (let bookIndex = 0; bookIndex < 5; bookIndex++) {
            const width = 0.15 + random() * 0.12;
            const height = 0.46 + random() * 0.2;
            const depth = 0.3 + random() * 0.12;
            const color = bookColors[Math.floor(random() * bookColors.length)];

            bookTransforms.push({
              x: bayX - 0.28 + bookIndex * 0.135 + (random() - 0.5) * 0.025,
              y: shelfY + height / 2,
              z: 0.04 + random() * 0.09,
              width,
              height,
              depth,
              color
            });
          }
        }
      }

      const books = new THREE.InstancedMesh(
        bookGeometry,
        bookMaterial,
        bookTransforms.length
      );
      books.castShadow = true;
      books.receiveShadow = true;

      const dummy = new THREE.Object3D();

      bookTransforms.forEach((book, index) => {
        dummy.position.set(book.x, book.y, book.z);
        dummy.scale.set(book.width, book.height, book.depth);
        dummy.updateMatrix();
        books.setMatrixAt(index, dummy.matrix);
        books.setColorAt(index, new THREE.Color(book.color));
      });

      books.instanceMatrix.needsUpdate = true;
      if (books.instanceColor) {
        books.instanceColor.needsUpdate = true;
      }

      group.add(books);
      return group;
    }

    function makeCarpet(x, z, width = 3.8, depth = 4.2) {
      const carpet = new THREE.Mesh(
        new THREE.PlaneGeometry(width, depth),
        materials.carpet
      );
      carpet.rotation.x = -Math.PI / 2;
      carpet.position.set(x, 0.085, z);
      carpet.receiveShadow = true;
      scene.add(carpet);
    }

    function makeDesk(x, z, rotationY) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotationY;
      scene.add(group);

      addBox(1.8, 0.14, 0.88, materials.wood, 0, 1.05, 0, group);
      addBox(1.55, 0.1, 0.65, materials.darkWood, 0, 0.52, 0, group);

      for (const lx of [-0.68, 0.68]) {
        for (const lz of [-0.31, 0.31]) {
          addBox(0.12, 1.02, 0.12, materials.darkWood, lx, 0.51, lz, group);
        }
      }

      addBox(0.58, 0.08, 0.42, materials.wood, -0.48, 1.18, 0.03, group);
      addBox(0.58, 0.08, 0.42, materials.wood, 0.48, 1.18, 0.03, group);
      addBox(0.5, 0.035, 0.37, materials.paleStone, -0.48, 1.235, 0.03, group);
      addBox(0.5, 0.035, 0.37, materials.paleStone, 0.48, 1.235, 0.03, group);

      for (let i = 0; i < 3; i++) {
        addBox(
          0.17 + random() * 0.08,
          0.46 + random() * 0.12,
          0.27,
          new THREE.MeshStandardMaterial({ color: [0x8b333d, 0x355b62, 0x9c7236][i] }),
          -0.55 + i * 0.48,
          1.38,
          -0.18,
          group
        );
      }

      const chair = new THREE.Group();
      chair.position.set(0, 0, 1.35);
      group.add(chair);

      addBox(0.72, 0.12, 0.62, materials.wood, 0, 0.72, 0, chair);
      addBox(0.72, 0.8, 0.1, materials.wood, 0, 1.08, -0.26, chair);

      for (const lx of [-0.28, 0.28]) {
        for (const lz of [-0.2, 0.2]) {
          addBox(0.07, 0.7, 0.07, materials.darkWood, lx, 0.35, lz, chair);
        }
      }

      makeCarpet(x, z);
    }

    const fountain = new THREE.Group();
    fountain.position.y = 0.08;
    scene.add(fountain);

    addCylinder(1.62, 1.72, 0.34, materials.paleStone, 0, 0.17, 0, fountain);
    addCylinder(1.4, 1.48, 0.28, materials.marble, 0, 0.4, 0, fountain);

    const water = new THREE.Mesh(
      new THREE.CircleGeometry(1.31, 64),
      materials.water
    );
    water.rotation.x = -Math.PI / 2;
    water.position.y = 0.55;
    fountain.add(water);

    addTorus(1.28, 0.11, materials.marble, 0, 0.57, 0, fountain).rotation.x = Math.PI / 2;

    addCylinder(0.22, 0.34, 1.5, materials.marble, 0, 1.28, 0, fountain);
    addCylinder(0.52, 0.22, 0.2, materials.marble, 0, 2.13, 0, fountain);
    addCylinder(0.08, 0.18, 0.52, materials.marble, 0, 2.48, 0, fountain);
    addSphere(0.17, materials.marble, 0, 2.8, 0, fountain);

    const jetMaterial = new THREE.MeshStandardMaterial({
      color: 0x8fd5df,
      emissive: 0x245e67,
      emissiveIntensity: 0.35,
      transparent: true,
      opacity: 0.58,
      roughness: 0.15
    });

    for (let i = 0; i < 3; i++) {
      const angle = (i / 3) * Math.PI * 2 + 0.3;
      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0, 2.72, 0),
        new THREE.Vector3(
          Math.cos(angle) * 0.38,
          3.0 + i * 0.12,
          Math.sin(angle) * 0.38
        ),
        new THREE.Vector3(
          Math.cos(angle) * 1.05,
          1.13,
          Math.sin(angle) * 1.05
        )
      );

      const jet = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 28, 0.022, 6, false),
        jetMaterial
      );
      fountain.add(jet);
    }

    const dropletCount = 90;
    const dropletPositions = new Float32Array(dropletCount * 3);
    const dropletData = [];

    for (let i = 0; i < dropletCount; i++) {
      dropletData.push({
        angle: random() * Math.PI * 2,
        radius: 0.25 + random() * 0.8,
        phase: random() * Math.PI * 2,
        speed: 0.8 + random() * 0.8
      });
    }

    const dropletGeometry = new THREE.BufferGeometry();
    dropletGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(dropletPositions, 3)
    );

    const droplets = new THREE.Points(
      dropletGeometry,
      new THREE.PointsMaterial({
        color: 0xc4f4f5,
        size: 0.055,
        transparent: true,
        opacity: 0.75,
        depthWrite: false
      })
    );
    scene.add(droplets);

    // -------------------------------------------------------------------------
    // Orange trees
    // -------------------------------------------------------------------------

    function makeOrangeTree(x, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);
      scene.add(group);

      addCylinder(0.12, 0.2, 2.15, materials.darkWood, 0, 1.05, 0, group);

      const branches = [
        [new THREE.Vector3(0, 1.45, 0), new THREE.Vector3(-0.65, 2.25, 0.15)],
        [new THREE.Vector3(0, 1.6, 0), new THREE.Vector3(0.62, 2.4, -0.12)],
        [new THREE.Vector3(0, 1.8, 0), new THREE.Vector3(0.08, 2.95, 0.18)],
        [new THREE.Vector3(0, 1.5, 0), new THREE.Vector3(-0.25, 2.75, -0.3)]
      ];

      for (const [start, end] of branches) {
        cylinderBetween(start, end, 0.065, materials.darkWood, group);
      }

      const clusters = [
        [-0.85, 2.55, 0.1, 0.85],
        [0.85, 2.65, -0.1, 0.9],
        [0.05, 3.05, 0.2, 0.95],
        [-0.25, 2.85, -0.45, 0.8],
        [0.45, 2.9, -0.55, 0.78],
        [-1.1, 2.25, 0.3, 0.65],
        [1.15, 2.3, -0.25, 0.68]
      ];

      for (let i = 0; i < clusters.length; i++) {
        const [cx, cy, cz, radius] = clusters[i];
        const cluster = new THREE.Mesh(
          new THREE.DodecahedronGeometry(radius, 1),
          i % 2 ? materials.leaf : materials.leafLight
        );
        cluster.position.set(cx, cy, cz);
        cluster.scale.set(1.1, 0.85, 1);
        cluster.castShadow = true;
        group.add(cluster);
      }

      const fruitPositions = [
        [-0.85, 2.28, 0.35],
        [0.88, 2.48, -0.2],
        [0.12, 2.83, 0.42],
        [-0.35, 2.72, -0.48],
        [0.48, 2.78, -0.5],
        [-1.02, 2.02, 0.18],
        [1.08, 2.12, 0.1]
      ];

      for (let i = 0; i < fruitPositions.length; i++) {
        addSphere(
          0.105 + random() * 0.025,
          materials.orange,
          fruitPositions[i][0],
          fruitPositions[i][1],
          fruitPositions[i][2],
          group
        );
      }
    }

    const lanternLights = [];

    function makeLantern(x, y, z) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      scene.add(group);

      const chain = CEILING - y - 0.4;
      addCylinder(0.018, 0.018, chain, materials.brass, 0, 0.4 + chain / 2, 0, group, 8);
      addCylinder(0.19, 0.2, 0.62, materials.glass, 0, 0, 0, group, 20);

      const top = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2),
        materials.brass
      );
      top.position.y = 0.34;
      top.castShadow = true;
      group.add(top);

      const bottom = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 18, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
        materials.brass
      );
      bottom.position.y = -0.34;
      bottom.castShadow = true;
      group.add(bottom);

      addTorus(0.2, 0.035, materials.brass, 0, 0.34, 0, group).rotation.x = Math.PI / 2;
      addTorus(0.2, 0.035, materials.brass, 0, -0.34, 0, group).rotation.x = Math.PI / 2;

      const light = new THREE.PointLight(0xffa64d, 28, 10, 2);
      light.position.y = 0;
      group.add(light);
      lanternLights.push(light);
    }

    // ---------------------------------------------------------------------
    // Layout: bookcases against the outer walls, desks and trees in the court
    // ---------------------------------------------------------------------

    const TALL = 1.35;  // bookcases reach the tile band

    for (const x of [-8, -4, 0, 4, 8]) {
      makeBookcase(x, -WALL_Z + 0.5, 0).scale.y = TALL;
    }
    for (const x of [-8, -4, 4, 8]) {
      makeBookcase(x, WALL_Z - 0.5, Math.PI).scale.y = TALL;
    }
    for (const z of [-6, -2, 2, 6]) {
      makeBookcase(-WALL_X + 0.5, z, Math.PI / 2).scale.y = TALL;
      makeBookcase(WALL_X - 0.5, z, -Math.PI / 2).scale.y = TALL;
    }

    const deskSpots = [
      [-6.7, 2.3, 1],
      [6.7, -1.7, -1],
      [-4.8, -3.8, 1],
      [4.8, 3.8, -1]
    ];
    deskSpots.forEach(([x, z, side]) => makeDesk(x, z, side * Math.PI / 2));

    const treeSpots = [
      [7.3, 1.6, 0.88],
      [-7.3, -1.6, 0.92],
      [-3, 4.6, 0.72],
      [3, -4.6, 0.72]
    ];
    treeSpots.forEach(([x, z, scale]) => makeOrangeTree(x, z, scale));

    makeLantern(-10.4, 5, -2.9);
    makeLantern(-10.4, 5, 2.9);
    makeLantern(10.4, 5, -2.9);
    makeLantern(10.4, 5, 2.9);
    makeLantern(-5, 5, -7.45);
    makeLantern(5, 5, -7.45);
    makeLantern(-5, 5, 7.45);
    makeLantern(5, 5, 7.45);

    // ---------------------------------------------------------------------
    // Candles: the fountain, the desks and the colonnade
    // ---------------------------------------------------------------------

    const candleSpots = [];

    for (let i = 0; i < 12; i++) {
      const angle = i * TAU / 12;
      candleSpots.push([Math.sin(angle) * 1.56, 0.42, Math.cos(angle) * 1.56]);
    }

    for (const [x, z, side] of deskSpots) {
      candleSpots.push([x + side * 0.3, 1.12, z - 0.8], [x + side * 0.3, 1.12, z + 0.8]);
    }

    for (const [x, z] of columnPositions) {
      const reach = Math.hypot(x, z);
      candleSpots.push([x - x / reach * 0.42, 0.24, z - z / reach * 0.42]);
    }

    const moveCandles = addCandles(scene, candleSpots);

    // Books stand against the gallery walls and either side of the fountain.
    const bookSpots = [
      [0, -7.7, 0],
      [-10.8, 0, Math.PI / 2],
      [10.8, 4.35, -Math.PI / 2],
      [-2.9, 1.2, 0],
      [2.9, -1.2, 0],
      [-10.8, -4.35, Math.PI / 2],
      [10.8, -4.35, -Math.PI / 2],
      [-5.8, 7.7, Math.PI]
    ];
    const books = placeBooks(scene, "cordoba", bookSpots, 1);

    const fountainGlow = new THREE.PointLight(0xffb066, 11, 9, 2);
    fountainGlow.position.set(0, 1.7, 2.4);
    scene.add(fountainGlow);

    // ---------------------------------------------------------------------
    // What the visitor cannot walk through
    // ---------------------------------------------------------------------

    const BODY = 0.4;
    const circles = [
      [0, 0, 1.75],
      ...columnPositions.map(([x, z]) => [x, z, 0.55]),
      ...treeSpots.map(([x, z, scale]) => [x, z, 1.35 * scale]),
      ...bookSpots.slice(0, books.length).map(([x, z]) => [x, z, 0.45])
    ];

    // Each desk and its chair, as a plain rectangle: the chair sits on the
    // side the desk was rotated towards.
    const rects = deskSpots.map(([x, z, side]) => [
      side > 0 ? x - 0.5 : x - 1.75,
      side > 0 ? x + 1.75 : x + 0.5,
      z - 0.95,
      z + 0.95
    ]);

    function collideCordoba(p) {
      for (const [cx, cz, radius] of circles) {
        const dx = p.x - cx;
        const dz = p.z - cz;
        const gap = Math.hypot(dx, dz) || 0.0001;
        const reach = radius + BODY;
        if (gap < reach) {
          p.x = cx + dx / gap * reach;
          p.z = cz + dz / gap * reach;
        }
      }

      for (const [left, right, near, far] of rects) {
        const nx = Math.max(left, Math.min(p.x, right));
        const nz = Math.max(near, Math.min(p.z, far));
        const dx = p.x - nx;
        const dz = p.z - nz;
        const gap = Math.hypot(dx, dz);

        if (gap > 0 && gap < BODY) {
          p.x = nx + dx / gap * BODY;
          p.z = nz + dz / gap * BODY;
        } else if (gap === 0) {
          const moves = [
            [p.x - left, -1, 0], [right - p.x, 1, 0],
            [p.z - near, 0, -1], [far - p.z, 0, 1]
          ].sort((a, b) => a[0] - b[0]);
          const [room, mx, mz] = moves[0];
          p.x += mx * (room + BODY);
          p.z += mz * (room + BODY);
        }
      }

      // Stops at the book faces.
      p.x = Math.max(-10.9, Math.min(10.9, p.x));
      p.z = Math.max(-7.9, Math.min(7.9, p.z));
    }


    const hemisphere = new THREE.HemisphereLight(0x39406e, 0x3a2418, 0.75);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0x8f7fc4, 0.35);
    sun.position.set(-12, 18, 13);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -22;
    sun.shadow.camera.right = 22;
    sun.shadow.camera.top = 22;
    sun.shadow.camera.bottom = -22;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 55;
    sun.shadow.normalBias = 0.025;
    sun.shadow.bias = -0.00015;
    scene.add(sun);
    scene.add(sun.target);

    const warmFill = new THREE.DirectionalLight(0xffb96f, 0.12);
    warmFill.position.set(14, 8, -10);
    scene.add(warmFill);

      return {
        scene,
        exposure: 1.08,
        fov: 58,
        eye: 2.2,           // a desk is 1.05 units tall, so a metre is about 1.4 units
        walk: 4.4,
        run: 8,
        entrance: { x: 1.45, z: 7.8, yaw: 0, pitch: 0.06 },
        doors: [{
          edge: 7.85,
          halfWidth: 0.95,
          to: "reading-room",
          label: "Door to the Grand Reading Room: walk into it"
        }],
        books,
        bookSize: 1,
        collide: collideCordoba,
        update(elapsed) {
          const positions = dropletGeometry.attributes.position.array;

          for (let i = 0; i < dropletCount; i++) {
            const data = dropletData[i];
            const angle = data.angle + elapsed * data.speed;
            const radius = data.radius + Math.sin(elapsed * 1.3 + data.phase) * 0.07;

            positions[i * 3] = Math.cos(angle) * radius;
            positions[i * 3 + 1] = 1.28 + Math.sin(elapsed * 2.1 + data.phase) * 0.11;
            positions[i * 3 + 2] = Math.sin(angle) * radius;
          }

          dropletGeometry.attributes.position.needsUpdate = true;

          lanternLights.forEach((light, index) => {
            light.intensity =
              34 + Math.sin(elapsed * 5.3 + index * 1.7) * 2.2 +
              Math.sin(elapsed * 11.1 + index) * 0.9;
          });

          domeGlow.intensity = 165 + Math.sin(elapsed * 6.1) * 9 + Math.sin(elapsed * 12.7) * 5;
          fountainGlow.intensity = 11 + Math.sin(elapsed * 8.3) * 1.2;
          moveCandles(elapsed);
          pulseBooks(books, elapsed);
        }
      };
    }

    // ---------------------------------------------------------------------
    // Map: The House of Wisdom
    // ---------------------------------------------------------------------

    function buildQuranHall() {
    // ---------------------------------------------------------------------
    // The endless hall: a forest of striped arches, after the prayer hall of
    // Cordoba's Great Mosque, with the Quran alone at its centre. The forest
    // follows the visitor by whole bays, so it never runs out, and walking far
    // enough in any direction loops back to the Quran.
    // ---------------------------------------------------------------------

    const scene = new THREE.Scene();
    const HALL_DARK = 0x0b0705;
    scene.background = new THREE.Color(HALL_DARK);
    scene.fog = new THREE.FogExp2(HALL_DARK, 0.055);

    const TAU = Math.PI * 2;
    const Y_AXIS = new THREE.Vector3(0, 1, 0);
    const BAY = 5.2;
    const REACH_BAYS = 7;           // columns drawn on each side of the visitor
    const LOOP = BAY * 8;           // far enough that the fog hides the jump back
    const COLUMN_RADIUS = 0.27;
    const COLUMN_HEIGHT = 2.9;
    const LOWER_SPRING = 3.2;       // top of the capitals
    const UPPER_SPRING = 6.6;
    const CEILING = 9.6;

    const materials = {
      stone: new THREE.MeshStandardMaterial({ color: 0xc9b596, roughness: 0.62 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x5b2f1d, roughness: 0.55 }),
      polishedWood: new THREE.MeshStandardMaterial({ color: 0x713c25, roughness: 0.36 }),
      paper: new THREE.MeshStandardMaterial({ color: 0xf0e6cf, roughness: 0.86 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xb98d3f, roughness: 0.34, metalness: 0.72 })
    };

    const unitBox = new THREE.BoxGeometry(1, 1, 1);
    const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 48);

    function box(parent, material, x, y, z, sx, sy, sz, ry = 0) {
      const mesh = new THREE.Mesh(unitBox, material);
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      mesh.rotation.y = ry;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(parent, material, radius, height, x, y, z) {
      const mesh = new THREE.Mesh(unitCylinder, material);
      mesh.position.set(x, y, z);
      mesh.scale.set(radius, height, radius);
      parent.add(mesh);
      return mesh;
    }

    function torus(parent, material, radius, tube, x, y, z, rx = 0) {
      const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 10, 96), material);
      mesh.position.set(x, y, z);
      mesh.rotation.x = rx;
      parent.add(mesh);
      return mesh;
    }

    // Everything here moves with the visitor, always by a whole number of bays.
    const forest = new THREE.Group();
    scene.add(forest);

    // ---- Floor and ceiling -----------------------------------------------

    const SPAN = BAY * (REACH_BAYS * 2 + 2);

    function tiled(paint) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 512;
      paint(canvas.getContext("2d"));
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(SPAN / BAY, SPAN / BAY);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const stoneFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(SPAN, SPAN),
      new THREE.MeshStandardMaterial({
        map: tiled(ctx => {
          ctx.fillStyle = "#b9a380";
          ctx.fillRect(0, 0, 512, 512);
          ctx.strokeStyle = "#8d7757";
          ctx.lineWidth = 4;
          for (let i = 0; i <= 4; i++) {
            const at = i * 128;
            ctx.beginPath();
            ctx.moveTo(at, 0);
            ctx.lineTo(at, 512);
            ctx.moveTo(0, at);
            ctx.lineTo(512, at);
            ctx.stroke();
          }
        }),
        roughness: 0.42
      })
    );
    stoneFloor.rotation.x = -Math.PI / 2;
    forest.add(stoneFloor);

    const woodCeiling = new THREE.Mesh(
      new THREE.PlaneGeometry(SPAN, SPAN),
      new THREE.MeshStandardMaterial({
        map: tiled(ctx => {
          ctx.fillStyle = "#3b2013";
          ctx.fillRect(0, 0, 512, 512);
          ctx.strokeStyle = "#a9823f";
          ctx.lineWidth = 8;
          ctx.strokeRect(0, 0, 512, 512);
        }),
        roughness: 0.7
      })
    );
    woodCeiling.rotation.x = Math.PI / 2;
    woodCeiling.position.y = CEILING;
    forest.add(woodCeiling);

    // ---- Arches ----------------------------------------------------------

    // One ring of alternating red and cream stones, drawn in a single mesh.
    function archGeometry(radius, ring, from, to, stones, depth) {
      const positions = [];
      const colors = [];
      const red = new THREE.Color(0x8e2f35);
      const cream = new THREE.Color(0xeee1c6);

      const point = (angle, r, z) => [Math.cos(angle) * r, Math.sin(angle) * r, z];

      for (let i = 0; i < stones; i++) {
        const a = from + (to - from) * i / stones;
        const b = from + (to - from) * (i + 1) / stones;
        const tint = i % 2 ? red : cream;

        const corners = {
          ai: point(a, radius, depth), bi: point(b, radius, depth),
          ao: point(a, radius + ring, depth), bo: point(b, radius + ring, depth),
          aI: point(a, radius, -depth), bI: point(b, radius, -depth),
          aO: point(a, radius + ring, -depth), bO: point(b, radius + ring, -depth)
        };

        const quad = (p, q, r, s) => {
          for (const vertex of [p, q, r, p, r, s]) {
            positions.push(...vertex);
            colors.push(tint.r, tint.g, tint.b);
          }
        };

        quad(corners.ai, corners.ao, corners.bo, corners.bi);
        quad(corners.aI, corners.bI, corners.bO, corners.aO);
        quad(corners.ai, corners.bi, corners.bI, corners.aI);
        quad(corners.ao, corners.aO, corners.bO, corners.bo);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      return geometry;
    }

    const LOWER_RADIUS = 2.2;
    const UPPER_RADIUS = 2.3;
    const LEAN = Math.PI / 6;       // the horseshoe runs thirty degrees past the semicircle
    const lowerCentre = LOWER_SPRING + LOWER_RADIUS * Math.sin(LEAN);

    const archMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.66,
      side: THREE.DoubleSide
    });

    const COUNT_LINE = REACH_BAYS * 2;
    const COLUMNS = COUNT_LINE * COUNT_LINE;

    const columns = new THREE.InstancedMesh(
      new THREE.CylinderGeometry(COLUMN_RADIUS * 0.92, COLUMN_RADIUS, COLUMN_HEIGHT, 12),
      new THREE.MeshStandardMaterial({ color: 0x9a7a5a, roughness: 0.38 }),
      COLUMNS
    );
    const capitals = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.8, 0.3, 0.8),
      new THREE.MeshStandardMaterial({ color: 0xd8c7a4, roughness: 0.6 }),
      COLUMNS
    );
    const piers = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.62, UPPER_SPRING - LOWER_SPRING, 0.62),
      new THREE.MeshStandardMaterial({ color: 0xd8c7a4, roughness: 0.7 }),
      COLUMNS
    );
    const lowerArches = new THREE.InstancedMesh(
      archGeometry(LOWER_RADIUS, 0.42, -LEAN, Math.PI + LEAN, 15, 0.2),
      archMaterial,
      COLUMNS * 2
    );
    const upperArches = new THREE.InstancedMesh(
      archGeometry(UPPER_RADIUS, 0.42, 0, Math.PI, 13, 0.2),
      archMaterial,
      COLUMNS * 2
    );
    const lamps = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.16, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0xffb25e, fog: true, toneMapped: false }),
      COLUMNS
    );

    {
      const place = new THREE.Matrix4();
      const turned = new THREE.Quaternion().setFromAxisAngle(Y_AXIS, Math.PI / 2);
      const straight = new THREE.Quaternion();
      const scale = new THREE.Vector3(1, 1, 1);
      const at = new THREE.Vector3();
      let index = 0;

      for (let i = -REACH_BAYS; i < REACH_BAYS; i++) {
        for (let j = -REACH_BAYS; j < REACH_BAYS; j++) {
          const x = (i + 0.5) * BAY;
          const z = (j + 0.5) * BAY;

          columns.setMatrixAt(index, place.compose(at.set(x, COLUMN_HEIGHT / 2, z), straight, scale));
          capitals.setMatrixAt(index, place.compose(at.set(x, LOWER_SPRING - 0.15, z), straight, scale));
          piers.setMatrixAt(index, place.compose(at.set(x, (LOWER_SPRING + UPPER_SPRING) / 2, z), straight, scale));

          // Arches run both ways from each column, so every aisle has them.
          lowerArches.setMatrixAt(index * 2, place.compose(at.set(x + BAY / 2, lowerCentre, z), straight, scale));
          lowerArches.setMatrixAt(index * 2 + 1, place.compose(at.set(x, lowerCentre, z + BAY / 2), turned, scale));
          upperArches.setMatrixAt(index * 2, place.compose(at.set(x + BAY / 2, UPPER_SPRING, z), straight, scale));
          upperArches.setMatrixAt(index * 2 + 1, place.compose(at.set(x, UPPER_SPRING, z + BAY / 2), turned, scale));

          // A small oil lamp in the middle of every bay.
          lamps.setMatrixAt(index, place.compose(at.set(x + BAY / 2, 5.4, z + BAY / 2), straight, scale));

          index++;
        }
      }
    }

    forest.add(columns, capitals, piers, lowerArches, upperArches, lamps);

    // ---- Light -----------------------------------------------------------

    scene.add(new THREE.AmbientLight(0xffd9a8, 0.55));
    scene.add(new THREE.HemisphereLight(0xffcf9a, 0x2c1a10, 0.9));

    // Candlelight that keeps pace with the visitor, so the near arches glow.
    const walkingGlow = new THREE.PointLight(0xffb066, 46, 22, 2);
    walkingGlow.position.y = 5.4;
    scene.add(walkingGlow);

    addHorseshoeDoor(scene, BAY * 1.5, 0.85);

    // ---------------------------------------------------------------------
    // A low stepped dais and a carved wooden stand holding an open Quran,
    // at its opening spread
    // ---------------------------------------------------------------------

    const DAIS_LOW = 0.22;
    const DAIS_HIGH = 0.44;
    const DAIS_OUTER = 1.68;
    const DAIS_INNER = 1.4;

    const daisGold = new THREE.MeshStandardMaterial({
      color: 0xd9a441,
      emissive: 0x6a4312,
      emissiveIntensity: 0.6,
      metalness: 0.45,
      roughness: 0.4
    });

    function daisStar(radius, points = 8, waist = 0.62) {
      const outline = [];
      for (let i = 0; i < points * 2; i++) {
        const angle = i * Math.PI / points;
        const r = i % 2 ? radius * waist : radius;
        outline.push([Math.cos(angle) * r, Math.sin(angle) * r]);
      }
      return outline;
    }

    function fillStar(ctx, x, y, outline, fill) {
      ctx.beginPath();
      outline.forEach(([px, py], index) => (
        index ? ctx.lineTo(x + px, y + py) : ctx.moveTo(x + px, y + py)
      ));
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }

    cylinder(scene, materials.stone, DAIS_OUTER, DAIS_LOW, 0, DAIS_LOW / 2, 0);
    cylinder(scene, materials.stone, DAIS_INNER, DAIS_HIGH, 0, DAIS_HIGH / 2, 0);
    torus(scene, daisGold, DAIS_OUTER, 0.035, 0, DAIS_LOW, 0, Math.PI / 2);
    torus(scene, daisGold, DAIS_INNER, 0.035, 0, DAIS_HIGH, 0, Math.PI / 2);

    // Inlaid top: one great star in lapis, oxblood and gold.
    const daisCanvas = document.createElement("canvas");
    daisCanvas.width = daisCanvas.height = 1024;
    {
      const ctx = daisCanvas.getContext("2d");
      ctx.fillStyle = "#c9ab7a";
      ctx.fillRect(0, 0, 1024, 1024);
      fillStar(ctx, 512, 512, daisStar(506, 16, 0.8), "#16346b");
      fillStar(ctx, 512, 512, daisStar(470, 16, 0.8), "#e3b04f");
      fillStar(ctx, 512, 512, daisStar(448, 16, 0.8), "#7a2230");
      fillStar(ctx, 512, 512, daisStar(330, 8), "#e3b04f");
      fillStar(ctx, 512, 512, daisStar(310, 8), "#16346b");
    }
    const daisTexture = new THREE.CanvasTexture(daisCanvas);
    daisTexture.colorSpace = THREE.SRGBColorSpace;
    daisTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const daisTop = new THREE.Mesh(
      new THREE.CircleGeometry(DAIS_INNER - 0.04, 96),
      new THREE.MeshStandardMaterial({ map: daisTexture, roughness: 0.42 })
    );
    daisTop.rotation.x = -Math.PI / 2;
    daisTop.position.y = DAIS_HIGH + 0.004;
    daisTop.receiveShadow = true;
    scene.add(daisTop);

    // ---- The stand -------------------------------------------------------

    const stand = new THREE.Group();
    stand.position.y = DAIS_HIGH;
    scene.add(stand);

    const STAND_SIDES = 8;
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.72, 1.02, 1.5, STAND_SIDES),
      materials.polishedWood
    );
    body.position.y = 0.95;
    body.rotation.y = Math.PI / STAND_SIDES;
    body.castShadow = true;
    stand.add(body);

    const foot = new THREE.Mesh(
      new THREE.CylinderGeometry(1.16, 1.24, 0.2, STAND_SIDES),
      materials.wood
    );
    foot.position.y = 0.1;
    foot.rotation.y = Math.PI / STAND_SIDES;
    foot.castShadow = true;
    stand.add(foot);

    for (const [radius, y] of [[1.04, 0.22], [0.74, 1.68]]) {
      const band = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, 0.06, STAND_SIDES),
        daisGold
      );
      band.position.y = y;
      band.rotation.y = Math.PI / STAND_SIDES;
      stand.add(band);
    }

    // The sloped top that the book rests on, tilted towards the door.
    const BOOK_TILT = 0.66;
    const cradle = new THREE.Group();
    cradle.position.set(0, 2.08, 0);
    cradle.rotation.x = BOOK_TILT;
    stand.add(cradle);

    box(cradle, materials.polishedWood, 0, -0.1, 0, 3.3, 0.12, 2.3);
    box(cradle, daisGold, 0, -0.03, 1.1, 3.3, 0.05, 0.1);    // the lip the book sits on
    box(cradle, materials.polishedWood, 0, 0.02, 1.22, 3.3, 0.2, 0.08);

    // ---- The book --------------------------------------------------------

    const PAGE_WIDTH = 1.5;
    const PAGE_DEPTH = 2.05;

    const coverMaterial = new THREE.MeshStandardMaterial({ color: 0x5a1c22, roughness: 0.5 });
    box(cradle, coverMaterial, -PAGE_WIDTH / 2 - 0.02, 0.01, 0, PAGE_WIDTH + 0.1, 0.05, PAGE_DEPTH + 0.1);
    box(cradle, coverMaterial, PAGE_WIDTH / 2 + 0.02, 0.01, 0, PAGE_WIDTH + 0.1, 0.05, PAGE_DEPTH + 0.1);
    box(cradle, materials.paper, -PAGE_WIDTH / 2, 0.08, 0, PAGE_WIDTH - 0.02, 0.1, PAGE_DEPTH - 0.02);
    box(cradle, materials.paper, PAGE_WIDTH / 2, 0.08, 0, PAGE_WIDTH - 0.02, 0.1, PAGE_DEPTH - 0.02);

    // Text from the Uthmani script. 1:3 repeats the last two words of 1:1.
    const FATIHA = [
      "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ",
      "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ",
      "ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ",
      "مَـٰلِكِ يَوْمِ ٱلدِّينِ",
      "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
      "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ",
      "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ"
    ];
    const BAQARAH = [
      "الٓمٓ",
      "ذَٰلِكَ ٱلْكِتَـٰبُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ",
      "ٱلَّذِينَ يُؤْمِنُونَ بِٱلْغَيْبِ وَيُقِيمُونَ ٱلصَّلَوٰةَ وَمِمَّا رَزَقْنَـٰهُمْ يُنفِقُونَ",
      "وَٱلَّذِينَ يُؤْمِنُونَ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ وَبِٱلْـَٔاخِرَةِ هُمْ يُوقِنُونَ",
      "أُو۟لَـٰٓئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ ۖ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ"
    ];

    const INDIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";

    // One page at a time: frame, title panel, then the verses, centred line
    // by line and flowing on from one verse to the next.
    function paintPage(canvas, title, bismillah, verses) {
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      const FONT = '"Amiri", "Noto Naskh Arabic", "Geeza Pro", serif';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.direction = "rtl";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = "#f2e6c9";
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "#b5862c";
      ctx.lineWidth = 12;
      ctx.strokeRect(46, 46, W - 92, H - 92);
      ctx.strokeStyle = "#16346b";
      ctx.lineWidth = 4;
      ctx.strokeRect(66, 66, W - 132, H - 132);
      ctx.strokeStyle = "#b5862c";
      ctx.lineWidth = 3;
      ctx.strokeRect(78, 78, W - 156, H - 156);

      for (const [x, y] of [[62, 62], [W - 62, 62], [62, H - 62], [W - 62, H - 62]]) {
        fillStar(ctx, x, y, daisStar(30), "#b5862c");
        fillStar(ctx, x, y, daisStar(14, 8, 0.7), "#16346b");
      }

      // Title panel.
      const panel = ctx.createLinearGradient(0, 110, 0, 240);
      panel.addColorStop(0, "#1c4385");
      panel.addColorStop(1, "#102a5c");
      ctx.fillStyle = panel;
      ctx.fillRect(112, 110, W - 224, 130);
      ctx.strokeStyle = "#e3b04f";
      ctx.lineWidth = 6;
      ctx.strokeRect(112, 110, W - 224, 130);
      fillStar(ctx, 172, 175, daisStar(34), "#e3b04f");
      fillStar(ctx, W - 172, 175, daisStar(34), "#e3b04f");
      ctx.fillStyle = "#f4d58a";
      ctx.font = `64px ${FONT}`;
      ctx.fillText(title, W / 2, 196);

      const left = 118;
      const width = W - left * 2;
      let y = 310;
      let size = 72;

      // Wrap the verses at this size; returns the lines.
      const lay = () => {
        ctx.font = `${size}px ${FONT}`;
        const lines = [];
        let line = "";
        verses.forEach((verse, index) => {
          // Pause marks sit on the word before them, so they wrap with it.
          const words = [
            ...verse.replace(/ ([\u06D6-\u06DC])/g, "\u00A0$1").split(" "),
            ayahMark(index + 1)
          ];
          for (const word of words) {
            const next = line ? `${line} ${word}` : word;
            if (line && ctx.measureText(next).width > width) {
              lines.push(line);
              line = word;
            } else {
              line = next;
            }
          }
        });
        if (line) lines.push(line);
        return lines;
      };

      const room = H - 120 - (bismillah ? 410 : 310);
      let lines = lay();
      while (size > 40 && lines.length * size * 1.72 > room) {
        size -= 2;
        lines = lay();
      }
      const leading = Math.min(size * 2.5, room / lines.length);

      if (bismillah) {
        ctx.fillStyle = "#16346b";
        ctx.font = `66px ${FONT}`;
        ctx.fillText(bismillah, W / 2, y + 30);
        y += 100;
      }

      y += (room - leading * lines.length) / 2;
      ctx.fillStyle = "#1c1410";
      ctx.font = `${size}px ${FONT}`;
      lines.forEach((text, index) => {
        ctx.fillText(text, W / 2, y + leading * (index + 0.72));
      });
    }

      function collideHall(p) {
        // Walk off one edge of the loop and you come back in from the other.
        if (p.x > LOOP) p.x -= LOOP * 2;
        if (p.x < -LOOP) p.x += LOOP * 2;
        if (p.z > LOOP) p.z -= LOOP * 2;
        if (p.z < -LOOP) p.z += LOOP * 2;

        const nearX = (Math.floor(p.x / BAY) + 0.5) * BAY;
        const nearZ = (Math.floor(p.z / BAY) + 0.5) * BAY;
        for (const [cx, cz, reach] of [[nearX, nearZ, 0.85], [0, 0, 1.95]]) {
          const dx = p.x - cx;
          const dz = p.z - cz;
          const gap = Math.hypot(dx, dz) || 0.0001;
          if (gap < reach) {
            p.x = cx + dx / gap * reach;
            p.z = cz + dz / gap * reach;
          }
        }

        // The door's panel fills one arch, so it stops you from either side.
        if (Math.abs(p.x) < PANEL_HALF && Math.abs(p.z - PANEL_Z) < 0.5) {
          p.z = PANEL_Z + (p.z < PANEL_Z ? -0.5 : 0.5);
        }
      }

    function mesh(geometry, material, x = 0, y = 0, z = 0, parent = scene) {

    function sphere(radius, material, x = 0, y = 0, z = 0, parent = scene, segments = 16) {

    function cylinderBetween(a, b, radius, material, parent = scene, topRadius = radius) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const object = mesh(
        new THREE.CylinderGeometry(topRadius, radius, direction.length(), 10),
        material,
        0, 0, 0,
        parent
      );
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return object;
    }

    function pointedArchShape(innerWidth, innerHeight, outerWidth, outerHeight) {
      const outer = new THREE.Shape();
      const ow = outerWidth / 2;
      const oh = outerHeight;
      const spring = oh - 1.15;

      outer.moveTo(-ow, 0);
      outer.lineTo(ow, 0);
      outer.lineTo(ow, spring);
      outer.quadraticCurveTo(ow, oh, 0, oh);
      outer.quadraticCurveTo(-ow, oh, -ow, spring);
      outer.lineTo(-ow, 0);
      outer.closePath();

      const hole = new THREE.Path();
      const iw = innerWidth / 2;
      const ih = innerHeight;
      const ispring = ih - 0.85;

      hole.moveTo(-iw, 0.03);
      hole.lineTo(iw, 0.03);
      hole.lineTo(iw, ispring);
      hole.quadraticCurveTo(iw, ih, 0, ih);
      hole.quadraticCurveTo(-iw, ih, -iw, ispring);
      hole.lineTo(-iw, 0.03);
      hole.closePath();

      outer.holes.push(hole);
      return outer;
    }

    function addPointedArch(x, y, z, outerW, outerH, innerW, innerH, rotation = Math.PI / 2, material = materials.stone) {

          curveSegments: 14

        x, y, z

      frame.rotation.y = rotation;

      return frame;
    }

    function createPalm(x, z, scale = 1, phase = 0) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);
      scene.add(group);

      const trunkPoints = [
        [0, 0, 0],
        [0.12, 1.25, 0.08],
        [0.3, 2.55, -0.08],
        [0.55, 3.8, 0.12],
        [0.75, 4.65, 0.2]
      ];

      for (let i = 0; i < trunkPoints.length - 1; i++) {
        cylinderBetween(
          trunkPoints[i],
          trunkPoints[i + 1],
          0.18 - i * 0.025,
          materials.wood,
          group,
          0.15 - i * 0.022
        );
      }

      const crown = new THREE.Group();
      crown.position.set(0.75, 4.68, 0.2);
      group.add(crown);
      palms.push({ crown, phase });

      const leafMaterial = new THREE.MeshStandardMaterial({
        color: 0x355c35,
        roughness: 0.8,
        side: THREE.DoubleSide
      });
      const leafEdgeMaterial = new THREE.MeshStandardMaterial({
        color: 0x668345,
        roughness: 0.86,
        side: THREE.DoubleSide
      });

      function frond(angle, length, tilt) {
        const frond = new THREE.Group();
        frond.rotation.y = angle;
        frond.rotation.z = tilt;

        const positions = [];
        const indices = [];
        const segments = 9;

        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const curveX = Math.sin(t * 2.1) * 0.28 * t;
          const y = t * length;
          const width = 0.3 * Math.sin(Math.PI * t) + 0.04;
          const z = Math.sin(t * 1.3) * 0.12 * t;

          positions.push(curveX - width / 2, y, z);
          positions.push(curveX + width / 2, y, z);
        }

        for (let i = 0; i < segments; i++) {
          const a = i * 2;
          indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        const ribbon = mesh(geometry, leafMaterial, 0, 0, 0, frond);
        ribbon.castShadow = true;

        for (let j = 0; j < 5; j++) {
          const t = 0.18 + j * 0.14;
          const leaf = mesh(
            new THREE.ShapeGeometry(new THREE.Shape(), 5),
            leafEdgeMaterial,
            Math.sin(t * 2.1) * 0.28 * t,
            t * length,
            Math.sin(t * 1.3) * 0.12 * t,
            frond
          );
          leaf.rotation.z = j % 2 === 0 ? 0.12 : -0.12;
          leaf.scale.set(0.65, 1.4, 1);
        }

        crown.add(frond);
      }

      for (let i = 0; i < 9; i++) {
        frond((i / 9) * Math.PI * 2 + 0.25, 3.1 + random() * 0.55, (random() - 0.5) * 0.28);
      }

      // Small clusters of dates.
      for (let i = 0; i < 12; i++) {
        const date = sphere(
          0.09 + random() * 0.04,
          new THREE.MeshStandardMaterial({ color: 0x684526, roughness: 0.9 }),
          (random() - 0.5) * 0.7,
          1.1 + random() * 1.2,
          (random() - 0.5) * 0.7,
          group,
          7
        );
        date.scale.y = 1.7;
      }

      return group;
    }

    // One shelf bay of upright volumes; rotation turns the row along the wall.
    function addBook(x, y, z, width, depth, height, rotation = 0) {
      for (let along = -0.33; along < 0.28;) {

        spines.push({
          x: x + Math.cos(rotation) * middle,
          y: y + tall / 2,
          z: z - Math.sin(rotation) * middle,
          thick,
          tall,
          rotation,
          color: SPINE_COLORS[Math.floor(random() * SPINE_COLORS.length)]
        });
        along += thick + 0.012;
      }
    }

    // One bay of rolled scrolls, ends out, stacked in a small pyramid.
    function addScroll(x, y, z, rotation = 0) {
      for (const [across, up] of [[-0.2, 0.08], [0, 0.08], [0.2, 0.08], [-0.1, 0.25], [0.1, 0.25], [0, 0.42]]) {
        scrolls.push({

          } else {

    // Side shelves.
