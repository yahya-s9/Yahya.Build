<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Yahya Builds</title>
<meta name="description" content="Things Yahya has built.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yahya.build/projects">
<meta property="og:title" content="Projects · Yahya Builds">
<meta property="og:image" content="https://yahya.build/opengraph-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500&display=swap">
<style>
  /* Same pixel type as the homepage: Silkscreen for titles, Pixelify Sans for sentences. */
  :root {
    --text: #F0F4F8; --muted: rgba(240, 244, 248, .62);
    /* Arcade tiles: a solid panel, cream pixel edge, gold when selected (the homepage's dawn accent). */
    --panel: #141a29; --edge: #e8dfce; --edge-hot: #e2bb77;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--text); font-family: "Pixelify Sans", monospace; -webkit-font-smoothing: antialiased;
    /* The night painting, darkened so the tiles read clearly. */
    background:
      linear-gradient(rgba(11, 13, 24, .55), rgba(11, 13, 24, .82)),
      #0f1420 url(/prayer/isha-sky.jpg) 54% center / cover no-repeat fixed;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 64px; }
  @media (min-width: 768px) { main { padding: 64px 32px 96px; } }

  .home {
    display: inline-block; font: 700 12px/1 "Silkscreen", monospace; letter-spacing: .2em;
    color: var(--muted); text-decoration: none; text-transform: uppercase; transition: color .3s;
  }
  .home:hover, .home:focus-visible { color: var(--text); outline: none; }
  h1 {
    margin: 28px 0 32px; text-align: center;
    font: 700 min(41px, 8vw)/1.2 "Silkscreen", monospace; letter-spacing: .2em;
  }
  @media (min-width: 768px) { h1 { margin: 36px 0 48px; } }

  /* Gaps leave room for each tile's 3px outline and hard shadow. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 30px 26px; padding: 3px; }

  /* Arcade tiles, matching the homepage keys: square, solid, a 3px pixel outline with notched corners,
     a hard drop shadow, and no blur or rounding anywhere. */
  .tile {
    --e: var(--edge);
    display: flex; flex-direction: column; overflow: hidden; border-radius: 0;
    color: inherit; text-decoration: none; background: var(--panel);
    box-shadow:
      inset 0 3px 0 0 rgba(255, 255, 255, .06),
      0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e),
      0 11px 0 0 rgba(0, 0, 0, .45);
    transition: transform 80ms steps(2);
  }
  .tile:hover, .tile:focus-visible { --e: var(--edge-hot); transform: translateY(-4px); outline: none; }
  .tile:active {
    transform: translateY(5px);
    box-shadow:
      0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e),
      0 5px 0 0 rgba(0, 0, 0, .45);
  }
  /* Crop a little above centre: thumbnails often carry their title near the top (Devpost's are 3:2).
     A pixel rule in the tile's edge colour separates picture and text. */
  .thumb {
    aspect-ratio: 16 / 9; width: 100%; display: block; object-fit: cover; object-position: center 30%;
    background: rgba(255, 255, 255, .04); border-bottom: 3px solid var(--e);
  }
  .thumb.blank {
    display: flex; align-items: center; justify-content: center;
    font: 700 28px/1 "Silkscreen", monospace; color: rgba(240, 244, 248, .3);
    background: #1f2840;
  }
  .body { position: relative; padding: 16px 20px 18px 24px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .name { position: relative; margin: 0; font: 700 15px/1.3 "Silkscreen", monospace; letter-spacing: .08em; }
  /* Arcade-menu cursor beside the name of the tile you're on. */
  .name::before {
    content: "▶"; position: absolute; left: -16px; top: .1em; font-size: 10px; color: var(--edge-hot); visibility: hidden;
  }
  .tile:hover .name::before, .tile:focus-visible .name::before { visibility: visible; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .tile:hover .name::before, .tile:focus-visible .name::before { animation: none; } }
  /* Devpost taglines can run long: show at most three lines. */
  .desc {
    margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
  }
  .host {
    margin-top: auto; padding-top: 8px; color: var(--muted);
    font: 700 11px/1 "Silkscreen", monospace; letter-spacing: .15em; text-transform: uppercase;
  }

  .empty { text-align: center; font-size: 17px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <a class="home" href="/">← Yahya Builds</a>
  <h1>Projects</h1>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Projects coming soon.</p>
</main>

<script src="/projects/projects.js"></script>
<script>
  // Tiles come from the visible projects on Devpost (/projects/devpost), with PROJECT_OVERRIDES from
  // projects.js applied. If Devpost can't be reached, the backup list in projects.js is used instead.
  // Text is inserted as text, never as HTML; only http(s) links are used.
  (function () {
    var grid = document.getElementById("grid");
    var overrides = window.PROJECT_OVERRIDES || {};

    function slugOf(link) { var m = /devpost\.com\/software\/([^/?#]+)/.exec(link || ""); return m ? m[1] : null; }
    function withOverrides(p) {
      var o = overrides[p.slug || slugOf(p.link)] || {};
      var out = {}; [p, o].forEach(function (src) { for (var k in src) out[k] = src[k]; });
      return out;
    }
    function usable(p) { return p && !p.hidden && p.name && /^https?:\/\//.test(p.link || ""); }

    fetch("/projects/devpost")
      .then(function (r) { return r.ok ? r.json() : { projects: [] }; })
      .catch(function () { return { projects: [] }; })
      .then(function (data) {
        var fromDevpost = (data && data.projects) || [];
        var list = (fromDevpost.length ? fromDevpost : window.PROJECTS || []).map(withOverrides).filter(usable);
        if (!list.length) { document.getElementById("empty").hidden = false; return; }
        list.forEach(render);
      });

    function render(p) {
      var tile = document.createElement("a");
      tile.className = "tile"; tile.href = p.link; tile.target = "_blank"; tile.rel = "noopener";

      var thumb;
      if (p.thumbnail) {
        thumb = document.createElement("img");
        thumb.alt = ""; thumb.loading = "lazy";
        // Devpost's own thumbnail is only 333px wide. Ask Next's image resizer for a sharp 750px copy of
        // the original instead; if that fails, fall back to Devpost's thumbnail as is.
        var devpost = /^(https:\/\/d112y698adiu2z\.cloudfront\.net\/.+\/)medium\.(png|jpe?g|gif)$/i.exec(p.thumbnail);
        if (devpost) {
          thumb.src = "/_next/image?url=" + encodeURIComponent(devpost[1] + "original." + devpost[2]) + "&w=750&q=75";
          thumb.onerror = function () { this.onerror = null; this.src = p.thumbnail; };
        } else {
          thumb.src = p.thumbnail;
        }
      } else {
        thumb = document.createElement("div");
        thumb.classList.add("blank");
        thumb.textContent = p.name.trim().charAt(0).toUpperCase();
      }
      thumb.classList.add("thumb");

      var body = document.createElement("div"); body.className = "body";
      var name = document.createElement("h2"); name.className = "name"; name.textContent = p.name;
      body.appendChild(name);
      if (p.description) {
        var desc = document.createElement("p"); desc.className = "desc"; desc.textContent = p.description;
        body.appendChild(desc);
      }
      var host = document.createElement("span"); host.className = "host";
      try { host.textContent = new URL(p.link).hostname.replace(/^www\./, "") + " ↗"; } catch (e) { host.textContent = "↗"; }
      body.appendChild(host);

      tile.appendChild(thumb); tile.appendChild(body);
      grid.appendChild(tile);
    }
  })();
</script>
</body>
</html>
