<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahya</title>
<meta name="description" content="A solitary figure in prayer, through the five prayers of the day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap">
<link rel="preload" as="image" href="/prayer/fajr.jpg">
<style>
  /* Designed in Stitch: "Minimal Desert Sanctuary - Celestial Prayer Cycle" */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0f1420;
    font-family: "Cormorant Garamond", Georgia, serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    --ui-text: #F3EFE6; --ui-glow: rgba(243, 239, 230, .55);
  }
  body.fajr    { --ui-text: #F3EFE6; --ui-glow: rgba(243, 239, 230, .55); }
  body.dhuhr   { --ui-text: #172B4D; --ui-glow: rgba(255, 255, 255, .7); }
  body.asr     { --ui-text: #2D251C; --ui-glow: rgba(255, 240, 215, .85); }
  body.maghrib { --ui-text: #FBEAD2; --ui-glow: rgba(251, 169, 76, .55); }
  body.isha    { --ui-text: #E8DFCE; --ui-glow: rgba(220, 235, 255, .65); }

  .sanctuary {
    position: relative; height: 100vh; height: 100dvh; width: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 24px; user-select: none; -webkit-user-select: none;
  }
  @media (min-width: 640px)  { .sanctuary { padding: 40px; } }
  @media (min-width: 768px)  { .sanctuary { padding: 56px; } }
  @media (min-width: 1024px) { .sanctuary { padding: 64px; } }

  .sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .sky img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    /* The figure kneels right of center; bias the crop so phones keep him and the sun in frame. */
    object-fit: cover; object-position: 54% center;
    opacity: 0; transition: opacity 2.5s cubic-bezier(.4, 0, .2, 1); will-change: opacity;
  }
  .sky img.on { opacity: 1; }

  .ui { position: relative; z-index: 1; color: var(--ui-text); transition: color 2s ease; }
  header.ui { display: flex; justify-content: flex-end; align-items: center; }
  a { font: inherit; color: inherit; text-decoration: none; }
  a:focus-visible { outline: 1px solid var(--ui-text); outline-offset: 4px; }

  .links { display: flex; gap: 28px; font-size: 12px; text-transform: uppercase; letter-spacing: .26em; }
  .links a { opacity: .8; transition: opacity .3s, text-shadow .3s; }
  .links a:hover { opacity: 1; text-shadow: 0 0 12px var(--ui-glow); }

  @media (prefers-reduced-motion: reduce) {
    .sky img { transition-duration: .8s; }
  }
</style>
</head>
<body class="fajr">
<main class="sanctuary">
  <div class="sky" aria-hidden="true">
    <img class="on" data-prayer="fajr" src="/prayer/fajr.jpg" alt="">
    <img data-prayer="dhuhr" src="/prayer/dhuhr.jpg" alt="">
    <img data-prayer="asr" src="/prayer/asr.jpg" alt="">
    <img data-prayer="maghrib" src="/prayer/maghrib.jpg" alt="">
    <img data-prayer="isha" src="/prayer/isha.jpg" alt="">
  </div>

  <header class="ui">
    <nav class="links" aria-label="Site">
      <a href="/bookshelf">Bookshelf</a>
      <a href="/library">Library</a>
    </nav>
  </header>

</main>

<script>
  // Each prayer holds for STEP ms, then crossfades to the next, looping Isha back to Fajr.
  var PRAYERS = ["fajr", "dhuhr", "asr", "maghrib", "isha"];
  var STEP = 7000;
  var current = 0;
  var layers = document.querySelectorAll(".sky img");
  setInterval(function () {
    current = (current + 1) % PRAYERS.length;
    var p = PRAYERS[current];
    layers.forEach(function (l) { l.classList.toggle("on", l.dataset.prayer === p); });
    document.body.className = p;
  }, STEP);
</script>
</body>
</html>
